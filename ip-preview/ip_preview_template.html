<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP Watch Preview</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#5b6472;--line:#dfe3e9;--accent:#2563eb;
--pat:#3b82f6;--des:#a855f7;--um:#d97706;--exp:#8a8f98;--new:#16a34a;--newtxt:#fff;--chgtxt:#fff;--chg:#c2410c;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#171c23;--text:#e8ebf0;--muted:#9aa4b2;--line:#2a313b;--accent:#6ea0ff;--pat:#60a5fa;--des:#c084fc;--um:#fbbf24;--exp:#7b828c;--new:#4ade80;--newtxt:#052e16;--chgtxt:#431407;--chg:#fb923c;--warn:#fcd34d;--warnbg:#3a2e0a}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#171c23;--text:#e8ebf0;--muted:#9aa4b2;--line:#2a313b;--accent:#6ea0ff;--pat:#60a5fa;--des:#c084fc;--um:#fbbf24;--exp:#7b828c;--new:#4ade80;--newtxt:#052e16;--chgtxt:#431407;--chg:#fb923c;--warn:#fcd34d;--warnbg:#3a2e0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:24px 0 8px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin:12px 0;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.src b{display:block}.src span{color:var(--muted);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;border:1px solid var(--line)}
.ok{color:var(--new)}.bad{color:var(--chg)}.mut{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:90px}
.stat b{font-size:18px;display:block}.stat span{font-size:11px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.bar input,.bar select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.bar input{min-width:220px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:13px}
th{position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--muted);user-select:none}
tr.r td:first-child{border-left:5px solid var(--pat);padding-left:8px}
tr.t-design td:first-child{border-left-color:var(--des)}
tr.t-utility_model td:first-child{border-left-color:var(--um)}
tr.t-unverified td:first-child{border-left-style:dashed}
tr.expired td{color:var(--exp)}tr.expired td a{color:var(--exp)}
tr.expired .title{text-decoration:line-through;text-decoration-color:var(--line)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.flag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin:0 3px 2px 0;border:1px solid}
.f-new{color:var(--newtxt);background:var(--new);border-color:var(--new)}
.f-chg{color:var(--chgtxt);background:var(--chg);border-color:var(--chg)}
.f-ns{color:var(--warn)}.f-base{color:var(--muted)}
.flag{font-size:12px;padding:1px 8px;letter-spacing:.3px}
tr.hl-new td{background:color-mix(in srgb,var(--new) 13%,transparent)}
tr.hl-chg td{background:color-mix(in srgb,var(--chg) 15%,transparent)}
tr.hl-new td:first-child{box-shadow:inset 6px 0 0 var(--new)}
tr.hl-chg td:first-child{box-shadow:inset 6px 0 0 var(--chg)}
tr.hl-new td:first-child,tr.hl-chg td:first-child{border-left-width:5px}
tr.div td{background:var(--bg);font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;padding:9px;color:var(--text);border-bottom:2px solid var(--line)}
tr.div.d-new td{color:var(--new)}
a.fam{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent)}
.stat.hot b{color:var(--new)}.stat.hot{border-color:var(--new)}
.src-tag{font-size:11px;color:var(--muted);display:inline-block;margin-right:6px}
.small{font-size:12px;color:var(--muted)}.nw{white-space:nowrap}
details{margin-top:12px}summary{cursor:pointer;font-weight:600}
.empty{padding:20px;text-align:center;color:var(--muted)}
code{background:var(--bg);padding:0 4px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>IP Watch <span class="pill">preview</span></h1>
  <div class="sub" id="gen"></div>
  <div id="banners"></div>
  <h2>Sources</h2>
  <div class="grid" id="sources"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="brand"></div>
  <p class="small">Preview page. It is separate from the main dashboard and is not stored in the repository. Status shown as "estimated" is derived from the kind code or the patent term and must be confirmed in the national register. Nothing on this page is legal advice.</p>
</div>
<script>
const DATA = /*__DATA__*/null;
const TYPE_LABEL={patent:"Patent",design:"Design",utility_model:"Utility model",unverified:"Unverified"};
const SRC_LABEL={"known-list":"","ops-search":"EPO","ops-lookup":"EPO","ops-family":"EPO","bq-search":"Google","bq-lookup":"Google","bq-family":"Google"};
const JUR={US:"United States",EP:"European Patent Office",WO:"WIPO, international application",CN:"China",JP:"Japan",KR:"South Korea",TW:"Taiwan",HK:"Hong Kong",DE:"Germany",FR:"France",GB:"United Kingdom",IT:"Italy",ES:"Spain",AT:"Austria",CH:"Switzerland",DK:"Denmark",SE:"Sweden",FI:"Finland",NL:"Netherlands",BE:"Belgium",PL:"Poland",PT:"Portugal",IE:"Ireland",NO:"Norway",TR:"Turkey",RU:"Russia",UA:"Ukraine",IL:"Israel",IN:"India",SG:"Singapore",MY:"Malaysia",TH:"Thailand",VN:"Vietnam",ID:"Indonesia",PH:"Philippines",AU:"Australia",NZ:"New Zealand",CA:"Canada",MX:"Mexico",BR:"Brazil",AR:"Argentina",CL:"Chile",ZA:"South Africa",SA:"Saudi Arabia",AE:"United Arab Emirates",EA:"Eurasian Patent Organization"};
const isHot=r=>!!(r.flags.new||r.flags.changed||r.flags.new_kind);
const jurLabel=c=>c?(JUR[c]?c+" ("+JUR[c]+")":c):"";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https:\/\//.test(u||"")?u:"";
let cur=0, sort={k:"filing_date",d:-1}, F={q:"",type:"",status:"",juris:"",flag:"",fam:"",pf:""};

document.getElementById("gen").textContent="Generated "+DATA.generated+" UTC";
const bn=document.getElementById("banners");
if(DATA.demo) bn.innerHTML+='<div class="banner"><b>DEMO DATA.</b> These records are invented to show the layout. They are not real patents.</div>';
(DATA.notes||[]).forEach(n=>bn.innerHTML+='<div class="banner">'+esc(n)+'</div>');

document.getElementById("sources").innerHTML=DATA.sources.map(s=>
  '<div class="card src"><b>'+esc(s.name)+' <span class="pill '+(s.state==="read"?"ok":"bad")+'">'+esc(s.label)+'</span></b><span>'+esc(s.detail)+'</span></div>').join("");

const tabs=document.getElementById("tabs");
DATA.brands.forEach((b,i)=>{
  const t=document.createElement("button");t.className="tab";t.setAttribute("role","tab");
  const n=b.records.filter(isHot).length;
  t.textContent=b.name+" ("+b.records.length+(n?", "+n+" new/changed":"")+")";
  t.onclick=()=>{cur=i;F={q:"",type:"",status:"",juris:"",flag:"",fam:"",pf:""};draw();};
  tabs.appendChild(t);
});

function cmp(a,b,k){
  if(k==="topic_id"){const n=v=>v?+v:1e9;return n(a.topic_id)-n(b.topic_id);}
  const x=a[k]||"",y=b[k]||"";
  return x<y?-1:x>y?1:0;
}
function flagHtml(r){
  let h="";
  if(r.flags.new) h+='<span class="flag f-new">NEW</span>';
  if(r.flags.new_kind) h+='<span class="flag f-new" title="Same publication number as a record on the known list, published with another kind code (for example A1, A4, B1)">NEW KIND</span>';
  if(r.flags.changed) h+='<span class="flag f-chg" title="The status moved forward since the last run or the known list">CHANGED</span><div class="small">'+esc(r.flags.changed.from)+' → '+esc(r.flags.changed.to)+'</div>';
  if(r.flags.not_seen) h+='<span class="flag f-ns" title="On the known list, but no source returned it in this run">not seen this run</span>';
  if(r.flags.baseline) h+='<span class="flag f-base" title="First run: stored quietly as the baseline">baseline</span>';
  return h;
}
function draw(){
  [...tabs.children].forEach((t,i)=>t.setAttribute("aria-selected",i===cur));
  const b=DATA.brands[cur];
  const recs=b.records;
  const cnt=f=>recs.filter(f).length;
  let h='<div class="stats">'+
   stat(recs.length,"records")+stat(cnt(r=>r.flags.new),"new",1)+stat(cnt(r=>r.flags.new_kind),"new kind of known",1)+stat(cnt(r=>r.flags.changed),"changed",1)+
   stat(cnt(r=>r.status_class==="expired"),"expired / lapsed")+stat(cnt(r=>r.flags.not_seen),"not seen")+stat(b.review.length,"to review")+'</div>';
  if(b.baseline_run) h+='<div class="banner">First run for this brand with no known list: all records are stored quietly as the baseline. Nothing is flagged as new until the next run.</div>';
  if(b.coverage){
    const c=b.coverage;
    h+='<div class="card"><b>Coverage check against the known list:</b> found '+c.found+' of '+c.known_total+
      ' known records. '+c.new_found+' new record(s) found that are not on the list.'+
      (c.missing.length?'<details><summary>'+c.missing.length+' known record(s) not returned by any source</summary><div class="small">'+c.missing.map(esc).join(", ")+'</div></details>':'')+'</div>';
  }
  const jur=[...new Set(recs.map(r=>r.jurisdiction).filter(Boolean))].sort();
  const used=new Set(recs.map(r=>r.topic_id||0));
  const pfs=(DATA.product_families||[]).filter(f=>used.has(f.id));
  h+='<div class="bar"><input id="q" placeholder="Search number, title, applicant, family" value="'+esc(F.q)+'">'+
    sel("type",[["","All types"],["patent","Patents"],["design","Designs"],["utility_model","Utility models"],["unverified","Unverified"]])+
    sel("status",[["","All statuses"],["pending","Pending (application)"],["granted","Granted"],["expired","Expired / lapsed"],["unknown","Unknown"]])+
    sel("juris",[["","All jurisdictions"],...jur.map(j=>[j,jurLabel(j)])])+
    sel("pf",[["","All product families"],...pfs.map(f=>[String(f.id),f.name]),["0","(no family yet)"]])+
    sel("flag",[["","Everything"],["hot","New / changed only"],["new","New only"],["new_kind","New kind of known"],["changed","Changed only"],["not_seen","Not seen"]])+'</div>';
  h+='<div class="legend"><span><i class="sw" style="background:var(--pat)"></i>Patent</span><span><i class="sw" style="background:var(--des)"></i>Design</span><span><i class="sw" style="background:var(--um)"></i>Utility model</span><span><i class="sw" style="background:var(--exp)"></i>Grey: expired or lapsed (estimated unless a legal event is shown)</span></div>';
  h+='<div id="tbl"></div>';
  h+=reviewHtml(b)+diagHtml(b);
  document.getElementById("brand").innerHTML=h;
  const q=document.getElementById("q");q.oninput=()=>{F.q=q.value;rows();};
  ["type","status","juris","pf","flag"].forEach(k=>{const e=document.getElementById("f_"+k);e.onchange=()=>{F[k]=e.value;rows();};});
  rows();
}
const pn=n=>String(n||"").replace(/\s+/g,"");
const sq=t=>String(t).toLowerCase().replace(/[\s,.\/\-]/g,"");
const stat=(n,l,hot)=>'<div class="stat'+(hot&&n?" hot":"")+'"><b>'+n+'</b><span>'+l+'</span></div>';
function sel(k,opts){return '<select id="f_'+k+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(F[k]===o[0]?" selected":"")+'>'+esc(o[1])+'</option>').join("")+'</select>';}
function rows(){
  const b=DATA.brands[cur];
  let list=b.records.filter(r=>{
    if(F.type&&r.type!==F.type)return false;
    if(F.status&&r.status_class!==F.status)return false;
    if(F.juris&&r.jurisdiction!==F.juris)return false;
    if(F.flag==="hot"){if(!isHot(r))return false;}else if(F.flag&&!r.flags[F.flag])return false;
    if(F.pf!==""&&String(r.topic_id||0)!==F.pf)return false;
    if(F.fam&&r.family_id!==F.fam)return false;
    if(F.q){const s=(r.title+" "+r.number+" "+r.applicants.join(" ")+" "+r.family_id+" "+jurLabel(r.jurisdiction)+" "+r.topic).toLowerCase();if(!s.includes(F.q.toLowerCase())&&!sq(s).includes(sq(F.q)))return false;}
    return true;
  });
  list.sort((a,b)=>sort.d*cmp(a,b,sort.k));
  const famCount={};b.records.forEach(r=>{if(r.family_id)famCount[r.family_id]=(famCount[r.family_id]||0)+1;});
  const hot=list.filter(isHot), rest=list.filter(r=>!isHot(r));
  list=[...hot,...rest];
  const H=[["topic_id","Product family"],["number","Number"],["title","Title"],["jurisdiction","Juris."],["filing_date","Filed"],["priority_date","Earliest priority"],["status","Status"],["","Seen by"],["","Flags"]];
  let h='<div class="tw"><table><thead><tr><th data-k="type">Type</th>'+H.map(x=>'<th data-k="'+x[0]+'">'+x[1]+(sort.k===x[0]&&x[0]?(sort.d>0?" ▲":" ▼"):"")+'</th>').join("")+'</tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="10" class="empty">No records match. '+(b.records.length?"Change the filters.":"Nothing was returned for this brand in this run. See the diagnostics below.")+'</td></tr>';
  const rowHtml=r=>{
    const l=r.links||{};
    const links=(safeUrl(l.google)?'<a href="'+esc(safeUrl(l.google))+'" target="_blank" rel="noopener noreferrer">Google</a> ':'')+(safeUrl(l.espacenet)?'<a href="'+esc(safeUrl(l.espacenet))+'" target="_blank" rel="noopener noreferrer">Espacenet</a>':'');
    const hl=r.flags.changed?" hl-chg":(isHot(r)?" hl-new":"");
    const seen=[...new Set((r.sources||[]).map(x=>x in SRC_LABEL?SRC_LABEL[x]:x).filter(x=>x))];
    const pf=r.topic_id?'<span title="'+esc(r.topic_note)+'"><b>'+esc(r.topic)+'</b></span>':'<span class="small">not filed yet</span>';
    const fam=r.family_id?'<a class="fam" data-fam="'+esc(r.family_id)+'" title="Show only this family">'+esc(r.family_id)+'</a>'+(famCount[r.family_id]>1?' ('+famCount[r.family_id]+' records here)':''):'';
    return '<tr class="r t-'+esc(r.type)+(r.status_class==="expired"?" expired":"")+hl+'"><td>'+esc(TYPE_LABEL[r.type]||r.type)+(r.type_certain?"":' <span class="small" title="Kind code not clearly recognised">?</span>')+'</td>'+
    '<td>'+pf+'<div class="small">'+(r.family_id?'patent family '+fam:'')+'</div></td>'+
    '<td><b>'+esc(pn(r.number))+'</b><br><span class="small">'+links+'</span></td>'+
    '<td class="title">'+esc(r.title)+'<br><span class="small">'+esc((r.applicants||[]).slice(0,2).join("; "))+'</span></td>'+
    '<td>'+esc(jurLabel(r.jurisdiction))+'</td><td class="nw">'+esc(r.filing_date)+'</td><td class="nw">'+esc(r.priority_date)+'</td>'+
    '<td title="'+esc(r.status_basis)+'">'+esc(r.status)+(r.status_estimated?' <span class="small">(est.)</span>':'')+(r.status_note?'<div class="small">'+esc(r.status_note)+'</div>':'')+'</td>'+
    '<td>'+seen.map(x=>'<span class="src-tag">'+esc(x)+'</span>').join("")+'</td>'+
    '<td>'+flagHtml(r)+'</td></tr>';
  };
  if(hot.length){
    h+='<tr class="div d-new"><td colspan="10">▲ New or changed since the last run ('+hot.length+')</td></tr>'+hot.map(rowHtml).join("");
    if(rest.length) h+='<tr class="div"><td colspan="10">All other records ('+rest.length+')</td></tr>';
  }
  rest.forEach(r=>{h+=rowHtml(r);});
  h+='</tbody></table></div><div class="small" style="margin-top:4px">'+list.length+' of '+b.records.length+' shown</div>';
  document.getElementById("tbl").innerHTML=(F.fam?'<div class="small" style="margin:4px 0">Showing only family '+esc(F.fam)+' <a id="famclear" style="cursor:pointer">[show all]</a></div>':'')+h;
  document.querySelectorAll("#tbl a.fam").forEach(a=>a.onclick=()=>{F.fam=a.dataset.fam;rows();});
  const fc=document.getElementById("famclear");if(fc)fc.onclick=()=>{F.fam="";rows();};
  document.querySelectorAll("#tbl th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(!k)return;sort=sort.k===k?{k,d:-sort.d}:{k,d:1};rows();});
}
function reviewHtml(b){
  if(!b.review.length) return '<h2>Possible matches to review</h2><div class="card small">None. No close-name candidate is waiting for approval.</div>';
  let h='<h2>Possible matches to review ('+b.review.length+')</h2><div class="small">These are not counted as this brand\'s filings. To approve one, add the applicant name to <code>names</code> in config.json.</div><div class="tw"><table><thead><tr><th>Number</th><th>Title</th><th>Applicant on the record</th><th>Closest brand name</th><th>Score</th><th>Why it is here</th></tr></thead><tbody>';
  b.review.forEach(r=>{
    const l=r.links||{};
    h+='<tr><td><b>'+esc(pn(r.number))+'</b><br><span class="small">'+(safeUrl(l.google)?'<a href="'+esc(safeUrl(l.google))+'" target="_blank" rel="noopener noreferrer">Google</a> ':'')+(safeUrl(l.espacenet)?'<a href="'+esc(safeUrl(l.espacenet))+'" target="_blank" rel="noopener noreferrer">Espacenet</a>':'')+'</span></td><td>'+esc(r.title)+'</td><td>'+esc(r.applicant||r.applicants.join("; "))+'</td><td>'+esc(r.brand_name)+'</td><td>'+Math.round((+r.score||0)*100)+'%'+'</td><td>'+esc(r.why)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function diagHtml(b){
  const d=b.diag;
  let h='<details><summary>Diagnostics: what was searched and what was dropped</summary><div class="card">';
  h+='<div class="small">Names used: '+b.names.map(esc).join(" | ")+'</div>';
  h+='<p><b>Queries</b></p><table style="min-width:0"><thead><tr><th>Query</th><th>Returned</th><th>Total hits</th><th>Error</th></tr></thead><tbody>'+
    (d.queries.length?d.queries.map(q=>'<tr><td><code>'+esc(q.query)+'</code></td><td>'+q.hits+'</td><td>'+q.total+'</td><td>'+esc(q.error)+'</td></tr>').join(""):'<tr><td colspan="4" class="small">No query was run (EPO not available).</td></tr>')+'</tbody></table>';
  h+='<p><b>Dropped because the applicant name was not close</b> <span class="small">(top 15; check that nothing real is in here)</span></p>';
  h+=d.dropped.length?'<div class="small">'+d.dropped.map(x=>esc(x[0])+' ('+x[1]+')').join("; ")+'</div>':'<div class="small">None.</div>';
  if(d.excluded.length) h+='<p><b>Excluded by the exclusion list</b></p><div class="small">'+d.excluded.map(x=>esc(x[0])+' ('+x[1]+')').join("; ")+'</div>';
  h+='<p class="small">Extra EPO calls: '+d.lookup_calls+' direct lookups, '+d.family_calls+' family lookups, '+d.legal_calls+' legal-status lookups.</p>';
  if(d.errors.length) h+='<p class="bad"><b>Errors</b><br>'+d.errors.map(esc).join("<br>")+'</p>';
  return h+'</div></details>';
}
if(DATA.brands.length) draw();
</script>
</body>
</html>
