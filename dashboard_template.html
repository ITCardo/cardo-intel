*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;max-width:100vw;display:flex}
.sidebar{width:200px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 10px;position:fixed;height:100vh;top:0;left:0;overflow-y:auto;flex-shrink:0}

.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;color:var(--muted);cursor:pointer;font-weight:500;font-size:12px;transition:all .2s;user-select:none}

#main-wrapper{margin-left:200px;width:calc(100% - 200px);padding-bottom:60px;overflow-x:hidden}
header{padding:24px 32px 0}

.tab{display:none}.tab.active{display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px}
.b-critical{background:#3d1418;color:#ff7b72}.b-high{background:#3b2300;color:#f0a83a}.b-medium{background:#272040;color:#b79df5}.b-low{background:#0f2b17;color:#56d364}
.b-leads{background:#0f2b17;color:#56d364}.b-parity{background:#1a2634;color:#79b8ff}.b-partial{background:#272040;color:#b79df5}.b-behind{background:#3b2300;color:#f0a83a}.b-missing{background:#3d1418;color:#ff7b72}.b-at-risk{background:#3d1418;color:#ff7b72}
.muted{color:var(--muted)}.small{font-size:12px}
table{width:100%;border-collapse:collapse}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}

tbody tr.prod{cursor:pointer}

tr.expand td{background:var(--expand-bg);font-size:13px;color:var(--expand-text);padding:14px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:16px;padding:5px 14px;cursor:pointer;font:600 13px inherit}
.chip.on{color:var(--text);border-color:currentColor}
input[type=search],select{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit}
.brandtag{font-weight:700}

.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.hero-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cardo)}
.hero-card.sena::before{background:var(--sena)}.hero-card.asmax::before{background:var(--asmax)}.hero-card.reso::before{background:var(--reso)}.hero-card.ok::before{background:var(--ok)}
.hero-label{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:4px}

.brand-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px}

.brand-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.brand-dot.cardo{background:var(--cardo)}.brand-dot.sena{background:var(--sena)}.brand-dot.asmax{background:var(--asmax)}.brand-dot.reso{background:var(--reso)}
.comparison-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}

<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">🎯 Cardo Intel</div>
  
  <div class="sidebar-section">
    <div class="sidebar-label">Primary</div>
    <div id="nav-primary"></div>
  </div>
  
  <div class="sidebar-section">
    <div class="sidebar-label">Analysis</div>
    <div id="nav-analysis"></div>
  </div>
</aside>

<div id="main-wrapper">
  <header>
    <h1>Cardo <span class="accent">Competitive Intelligence</span></h1>
    <div class="sub">Cardo vs Sena vs ASMAX vs Reso · compiled by research agents · last updated <span id="lastUpdated">—</span></div>
    <div class="controls">
      <div style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <button id="fontDec" title="Decrease text size" style="background:var(--panel);color:var(--text);border:none;padding:6px 12px;cursor:pointer;font:600 13px inherit;border-right:1px solid var(--border)">A−</button>
        <button id="fontInc" title="Increase text size" style="background:var(--panel);color:var(--text);border:none;padding:6px 12px;cursor:pointer;font:600 13px inherit">A+</button>
      </div>
      <select id="themeSel" title="Dashboard style">
        <option value="dark">Dark</option>
        <option value="light">Bright</option>
        <option value="midnight">Midnight</option>
        <option value="sepia">Sepia</option>
        <option value="nord">Nord</option>
        <option value="contrast">High contrast</option>
      </select>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="tt" id="tt"></div>

<script>
const DATA = /*__DATA__*/;
const GAP = DATA.gap;
const BRANDS = DATA.brands;
const BCOLOR = {Cardo:"var(--cardo)",Sena:"var(--sena)",ASMAX:"var(--asmax)",Reso:"var(--reso)"};
const BHEX = {Cardo:"#e6002d",Sena:"#f7a600",ASMAX:"#22c1dd",Reso:"#8e6bff"};
const TABS = ["Overview","Products","Battles","Model Compare","Pricing","Gap Analysis","Social & Press","Software & Firmware","Voice of the Customer","Product Insights"];
const TAB_GROUPS = {
  "Primary": ["Overview","Model Compare"],
  "Analysis": ["Products","Battles","Pricing","Gap Analysis","Social & Press","Software & Firmware","Voice of the Customer","Product Insights"]
};
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify = s => esc(s).replace(/((?:https?:\/\/)?(?:[a-z0-9-]+\.)+(?:com|net|org|io)\b[^\s<>"'),]*)/gi,
  m => `<a href="${m.startsWith("http")?m:"https://"+m}" target="_blank" rel="noopener">${m}</a>`);
const fmt$ = v => v==null?"—":"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
const dot = b => `<span class="dot" style="background:${BCOLOR[b]}"></span>`;

/* ---------- last updated ---------- */
if(DATA.built_at){
  const bd=new Date(DATA.built_at);
  document.getElementById("lastUpdated").textContent=isNaN(bd)?DATA.built_at:
    bd.toLocaleString(undefined,{dateStyle:"long",timeStyle:"short"})+" ("+Intl.DateTimeFormat().resolvedOptions().timeZone+")";
}

/* ---------- theme switcher ---------- */
const themeSel=document.getElementById("themeSel");
themeSel.value=document.documentElement.getAttribute("data-theme")||"dark";
themeSel.onchange=()=>{
  document.documentElement.setAttribute("data-theme",themeSel.value);
  try{localStorage.setItem("cardoTheme",themeSel.value)}catch(e){}
};

/* ---------- font size controls ---------- */
let fontScale=100;
try{fontScale=+localStorage.getItem("cardoFontScale")||100}catch(e){}
function applyFontScale(){document.body.style.zoom=fontScale+"%"}
applyFontScale();
document.getElementById("fontInc").onclick=()=>{fontScale=Math.min(160,fontScale+10);applyFontScale();try{localStorage.setItem("cardoFontScale",fontScale)}catch(e){}};
document.getElementById("fontDec").onclick=()=>{fontScale=Math.max(70,fontScale-10);applyFontScale();try{localStorage.setItem("cardoFontScale",fontScale)}catch(e){}};

/* products flattened */
let PRODUCTS=[];
BRANDS.forEach(br=>br.products.forEach(p=>PRODUCTS.push({brand:br.competitor,...p})));
PRODUCTS.forEach(p=>{p.eff=(p.street_price_usd??p.msrp_usd);p.isHelmet=/helmet/i.test(p.name);p.isHeadphone=/headphone|edgephones|ridephones|tufftalk|earbud/i.test(p.name);p.isOutdoor=/\bsnowtalk\b|\bbikom\b|\boutdoor\b/i.test(p.name);p.cat=p.category||(p.isHelmet?"smart_helmet":p.isHeadphone?"headphones":p.isOutdoor?"outdoor":"communicator");p.usage=p.usage||"Motorcycle";p.mesh=/mesh|dmc/i.test(p.intercom_tech||"")&&!/no mesh/i.test(p.intercom_tech||"")});

/* ---------- sidebar navigation ---------- */
const main=document.getElementById("main");
let sections=TABS.map(()=>{const d=document.createElement("div");d.className="tab";main.appendChild(d);return d});

const primaryNav=document.getElementById("nav-primary");
const analysisNav=document.getElementById("nav-analysis");
const tabIndices={};

function getIcon(tabName){
  const icons={Overview:"📊","Model Compare":"⚔️",Pricing:"💰",Battles:"⚔️",Products:"📦","Gap Analysis":"⚠️","Social & Press":"📢","Software & Firmware":"🔧","Voice of the Customer":"💬","Product Insights":"💡"};
  return icons[tabName]||"📌";
}

TABS.forEach((t,i)=>{
  tabIndices[t]=i;
  const isAnalysis=TAB_GROUPS["Analysis"].includes(t);
  const navContainer=isAnalysis?analysisNav:primaryNav;
  const btn=document.createElement("div");
  btn.className="nav-item";
  btn.dataset.tabIndex=i;
  if(i===0)btn.classList.add("active");
  btn.innerHTML=`<span class="nav-icon">${getIcon(t)}</span><span>${t}</span>`;
  btn.onclick=()=>show(i);
  navContainer.appendChild(btn);
});

function show(i){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",+b.dataset.tabIndex===i));
  sections.forEach((s,j)=>s.classList.toggle("active",i===j));
  window.scrollTo(0,0);
}


/* ===== ALL TAB CONTENT GOES HERE (unchanged from original) ===== */
/* Copy the entire sections[0].innerHTML through sections[9].innerHTML from the original template */

/* ---------- Overview (stacked, full-width sections) ---------- */
sections[0].innerHTML = `
  <!-- 0: Purpose intro section -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:24px">
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px">
      <div style="font-size:18px;margin-bottom:6px">📊 Who Are They?</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5">Learn the basics: company size, founding year, location, and core product portfolios for each brand.</div>
    </div>
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px">
      <div style="font-size:18px;margin-bottom:6px">💪 What's Different?</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5">See what makes each brand stand out, where they struggle, and what opportunities exist in the market.</div>
    </div>
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px">
      <div style="font-size:18px;margin-bottom:6px">📰 What's Being Said?</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5">See how the media covers each brand — reviews, awards won, and the overall tone in the press.</div>
    </div>
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px">
      <div style="font-size:18px;margin-bottom:6px">🚀 What's Happening Now?</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5">Stay current with recent launches, partnerships, and strategic moves from all brands.</div>
    </div>
  </div>

  <!-- 1: Brand overview -->
  <div class="card" style="margin-bottom:16px">
    <h2 style="margin-top:0">Who Are They? Company Profiles</h2>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">Headquarters, founding year, market positioning, product count, and price ranges</div>
    <div class="grid g4">
    ${BRANDS.map(b=>`<div><div style="font-weight:700;margin-bottom:4px">${dot(b.competitor)}${esc(b.competitor)}${b.website?` <a href="${esc(b.website)}" target="_blank" rel="noopener" class="small" style="font-weight:400">↗</a>`:""}</div>
      <div class="small muted">${esc(b.company.hq.split(";")[0].split("(")[0])} · Founded ${esc((b.company.founded||"").match(/\d{4}/)?.[0]||"")}</div>
      <div class="small" style="margin-top:4px">${esc(b.company.positioning.split(";")[0].slice(0,140))}…</div>
      <div class="kv" style="padding:4px 0;border:none;font-size:12px"><span>Products</span><b>${b.products.length}</b></div>
      <div class="kv" style="padding:4px 0;border:none;font-size:12px"><span>Price range</span><b>${(()=>{const ps=b.products.map(p=>p.street_price_usd??p.msrp_usd).filter(v=>v!=null);return ps.length?fmt$(Math.min(...ps))+"-"+fmt$(Math.max(...ps)):"—"})()}</b></div></div>`).join("")}
    </div>
  </div>

  <!-- 2: Competitive positioning -->
  <div class="card" style="margin-bottom:16px">
    <h2 style="margin-top:0">What's Different? Strengths & Weaknesses</h2>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">What each brand excels at and where they face challenges</div>
    <div style="overflow-x:auto"><table style="font-size:12px;margin-bottom:8px">
      <thead><tr><th style="padding:6px">Brand</th><th style="padding:6px;color:var(--ok)">✓ What They Do Best</th><th style="padding:6px;color:var(--bad)">⚠ Where They Struggle</th></tr></thead>

const BAT=DATA.battles;
const SC={good:["GOOD","#0f2b17","#56d364"],soso:["SO-SO","#3b2300","#f0a83a"],bad:["BAD/NONE","#3d1418","#ff7b72"]};
let batMode="rank",curBattle=0,curModels=[];
const scell=(s,v)=>{const[t,bg,fg]=SC[s]||["?","#222","#999"];const show=(batMode==="value"&&v!=null&&v!=="")?v:t;return `<td style="background:${bg};color:${fg};font-weight:700;font-size:11px;letter-spacing:.3px;text-align:center">${esc(show)}</td>`};
// Pool every rated model across all battles (same 16-dimension schema everywhere), keyed "brand|model",
// so any model rated in ANY battle can be swapped into ANY battle's comparison matrix.
const RATED_POOL={};
BAT.battles.forEach(b=>{
  b.ratings.models.forEach(([br,m],ci)=>{
    const key=br+"|"+m;
    if(RATED_POOL[key])return;
    const cells={};
    b.ratings.rows.forEach(r=>{cells[r.dimension]={score:r.scores[ci],value:(r.values||[])[ci]}});
    RATED_POOL[key]={brand:br,model:m,cells};
  });
});
const POOL_KEYS=Object.keys(RATED_POOL).sort((a,b)=>RATED_POOL[a].brand.localeCompare(RATED_POOL[b].brand)||RATED_POOL[a].model.localeCompare(RATED_POOL[b].model));
const poolOptions=selectedKey=>BRANDS.map(br=>br.competitor).map(brand=>{
  const opts=POOL_KEYS.filter(k=>RATED_POOL[k].brand===brand).map(k=>`<option value="${esc(k)}"${k===selectedKey?" selected":""}>${esc(RATED_POOL[k].model)}</option>`).join("");
  return opts?`<optgroup label="${esc(brand)}">${opts}</optgroup>`:"";
}).join("");

function renderMatrix(){
  const legend=BAT.dimensions_legend;
  const dims=BAT.battles[curBattle].ratings.rows.map(r=>r.dimension);
  const originalCount=BAT.battles[curBattle].ratings.models.length;
  const head=`<th style="min-width:120px">Dimension</th>${curModels.map(([br,m],ci)=>{
    const key=br+"|"+m;
    return `<th style="color:${BCOLOR[br]};min-width:110px">
      <span class="mname">${esc(m)}</span>
      <span class="swapicon" data-ci="${ci}" title="Change model" style="cursor:pointer;opacity:.55;font-size:11px;margin-left:4px">⇄</span>
      ${ci>=originalCount?`<span class="rmicon" data-ci="${ci}" title="Remove column" style="cursor:pointer;opacity:.55;font-size:11px;margin-left:2px">✕</span>`:""}
      <div class="swapsel" data-ci="${ci}" style="display:none;margin-top:4px"><select style="width:100%;font-size:11px">${poolOptions(key)}</select></div>
    </th>`;
  }).join("")}${curModels.length<7?`<th style="min-width:40px;text-align:center"><span class="addicon" title="Add model to compare" style="cursor:pointer;opacity:.7;font-size:16px">+</span></th>`:""}<th style="min-width:180px">Notes</th>`;
  const body=dims.map((dim,ri)=>{
    const note=BAT.battles[curBattle].ratings.rows[ri].note||"";
    const cells=curModels.map(([br,m])=>{
      const c=RATED_POOL[br+"|"+m]?.cells?.[dim];
      return scell(c?.score,c?.value);
    }).join("");
    return `<tr><td title="${esc(legend[dim]||"")}" style="cursor:help"><b class="small">${esc(dim)}</b></td>${cells}${curModels.length<7?"<td></td>":""}<td class="small muted" style="text-align:left">${esc(note)}</td></tr>`;
  }).join("");
  const wrap=sections[2].querySelector("#matrixWrap");
  wrap.innerHTML=`<table class="matrix"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  wrap.querySelectorAll(".swapicon").forEach(el=>el.onclick=()=>{
    const sel=wrap.querySelector(`.swapsel[data-ci="${el.dataset.ci}"]`);
    sel.style.display=sel.style.display==="none"?"block":"none";
  });
  wrap.querySelectorAll(".swapsel select").forEach(sel=>sel.onchange=()=>{
    const ci=Number(sel.closest(".swapsel").dataset.ci);
    const [br,m]=sel.value.split("|");
    curModels[ci]=[br,m];
    renderMatrix();
  });
  wrap.querySelectorAll(".rmicon").forEach(el=>el.onclick=()=>{
    curModels.splice(Number(el.dataset.ci),1);
    renderMatrix();
  });
  const addBtn=wrap.querySelector(".addicon");
  if(addBtn)addBtn.onclick=()=>{
    const used=new Set(curModels.map(([br,m])=>br+"|"+m));
    const next=POOL_KEYS.find(k=>!used.has(k));
    if(!next)return;
    const [br,m]=next.split("|");
    curModels.push([br,m]);
    renderMatrix();
  };
}

function drawChart(){
  const pts=PRODUCTS.filter(p=>p.eff!=null&&(pTier==="smart_helmet"?p.cat==="smart_helmet":pTier==="headphones"?p.cat==="headphones":pTier==="outdoor"?p.cat==="outdoor":((inclHelmets||p.cat!=="smart_helmet")&&p.cat!=="headphones"&&p.cat!=="outdoor"&&(pTier==="all"||p.tier===pTier))));
  const W=1100,H=380,L=60,R=20,T=20,B=40,maxP=(pts.length?Math.max(...pts.map(p=>p.eff)):500)*1.08;
  const bx={};BRANDS.forEach((b,i)=>bx[b.competitor]=L+(W-L-R)*(i+0.5)/BRANDS.length);
  const y=v=>T+(H-T-B)*(1-v/maxP);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
  for(let g=0;g<=5;g++){const v=maxP*g/5;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">$${Math.round(v)}</text>`}
  BRANDS.forEach(b=>{s+=`<text x="${bx[b.competitor]}" y="${H-12}" text-anchor="middle" style="font-size:13px;font-weight:700;fill:${BHEX[b.competitor]}">${b.competitor}</text>`});
  const byBrand={};pts.forEach(p=>{(byBrand[p.brand]=byBrand[p.brand]||[]).push(p)});
  Object.entries(byBrand).forEach(([br,ps])=>{
    ps.sort((a,b)=>a.eff-b.eff);

      s+=`<g class="pt" data-n="${esc(p.name)}" data-b="${br}" data-p="${p.eff}" data-m="${p.msrp_usd??""}" data-t="${p.tier||(p.cat==="smart_helmet"?"smart helmet":p.cat==="headphones"?"headphones":p.cat==="outdoor"?"outdoor":"")}" style="cursor:pointer">${shape}</g>`;
    });
  });
  s+="</svg>";
  const el=sections[4].querySelector("#chart");el.innerHTML=s;
  el.querySelectorAll(".pt").forEach(g=>{
    g.onmousemove=e=>{tt.style.display="block";tt.style.left=(e.clientX+14)+"px";tt.style.top=(e.clientY+10)+"px";

      </tbody></table>`:(cs.firmware_baseline?`<div class="small muted" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--divider)"><b>Firmware baseline:</b> ${esc(cs.firmware_baseline)}</div>`:"")}
    </div>`}).join("")}
  </div>
  <h2>Update history <span class="small muted" id="fwCount" style="font-weight:400"></span></h2>
  <div class="chips">
    ${BRANDS.map(b=>`<button class="chip on" data-fb="${b.competitor}" style="color:${BCOLOR[b.competitor]}">${b.competitor}</button>`).join("")}
    ${["all","firmware","app"].map(t=>`<button class="chip${t==="all"?" on":""}" data-ft="${t}">${t==="all"?"All types":FW_TYPE_LABEL[t]}</button>`).join("")}
    <select id="fwProdSel"><option value="all">All products</option></select>
    <input type="search" id="fwQ" placeholder="Search version, feature, changelog…" style="flex:1;min-width:200px">
  </div>
  <div id="fwTimeline"></div>`;
function fwProductOptions(){
  const prods=Array.from(new Set(FW.filter(u=>fwBrands.has(u.brand)).map(u=>u.product).filter(Boolean))).sort();
  const sel=sections[7].querySelector("#fwProdSel");
  const cur=sel.value;
  sel.innerHTML=`<option value="all">All products</option>`+prods.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
  sel.value=prods.includes(cur)?cur:"all";
}
function renderFW(){
  fwProductOptions();
  const rows=FW.filter(u=>fwBrands.has(u.brand)&&(fwType==="all"||u.type===fwType)&&(fwProduct==="all"||u.product===fwProduct)&&(!fwQ||[u.title,u.version,u.product,(u.changes||[]).join(" "),u.source].join(" ").toLowerCase().includes(fwQ)));
  sections[7].querySelector("#fwCount").textContent=`· ${rows.length} updates`;
  sections[7].querySelector("#fwTimeline").innerHTML=rows.map(u=>{
    const[bg,fg]=FWCOL[u.type]||["#222","#999"];
    return `
    <div class="card" style="margin-bottom:12px;border-left:3px solid ${BHEX[u.brand]}">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <span class="small muted" style="font-variant-numeric:tabular-nums;font-weight:700">${esc(u.date||"—")}</span>
        <span class="brandtag small" style="color:${BCOLOR[u.brand]}">${esc(u.brand)}</span>
        <span class="badge" style="background:${bg};color:${fg}">${esc(FW_TYPE_LABEL[u.type]||u.type||"update")}</span>
        ${u.version?`<span class="badge" style="background:var(--panel2);color:var(--text)">v${esc(u.version)}</span>`:""}
        <span style="font-weight:700">${esc(u.title||"")}</span>
        ${u.product?`<span class="small muted">— ${esc(u.product)}</span>`:""}
      </div>
      ${u.changes&&u.changes.length?`<ul class="tight small" style="margin-bottom:6px">${u.changes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
      <div class="small muted">${esc(u.source||"")}${u.url?` · <a href="${esc(u.url)}" target="_blank">source ↗</a>`:""}</div>
    </div>`}).join("")||`<div class="card muted" style="padding:24px;text-align:center">No updates match the filters.</div>`;
}
sections[7].querySelectorAll(".chip[data-fb]").forEach(c=>c.onclick=()=>{const b=c.dataset.fb;c.classList.toggle("on");c.classList.contains("on")?fwBrands.add(b):fwBrands.delete(b);renderFW()});
sections[7].querySelectorAll(".chip[data-ft]").forEach(c=>c.onclick=()=>{fwType=c.dataset.ft;sections[7].querySelectorAll(".chip[data-ft]").forEach(x=>x.classList.toggle("on",x===c));renderFW()});
sections[7].querySelector("#fwProdSel").onchange=e=>{fwProduct=e.target.value;renderFW()};
sections[7].querySelector("#fwQ").oninput=e=>{fwQ=e.target.value.toLowerCase();renderFW()};
renderFW();

/* ---------- Voice of the Customer ---------- */
const SENT_COL={positive:["#0f2b17","#56d364"],negative:["#3d1418","#ff7b72"],mixed:["#272040","#b79df5"],neutral:["#1a2634","#79b8ff"]};
let VOC=[];
BRANDS.forEach(b=>{(b.customer_feedback||[]).forEach(f=>VOC.push({brand:b.competitor,...f}))});
VOC.forEach(f=>f.k=dkey(f.date));
VOC.sort((a,b)=>b.k-a.k);
let vocBrands=new Set(BRANDS.map(b=>b.competitor)),vocSent="all",vocSource="all",vocProduct="all",vocQ="";
sections[8].innerHTML=`
  <h2>Voice of the Customer</h2>
  <div class="note-banner">Real customer feedback pulled from owner Facebook groups and Reddit (r/motorcyclegear) by the Social Media Listener agent. Facebook groups are member-gated, so Reddit is typically the larger, more reliable source — coverage will vary by brand.</div>
  <div class="grid g4" style="margin-bottom:24px">
  ${BRANDS.map(b=>{
    const items=(b.customer_feedback||[]);
    const n=items.length;
    const counts={positive:0,negative:0,mixed:0,neutral:0};
    items.forEach(f=>{if(f.sentiment)counts[f.sentiment]=(counts[f.sentiment]||0)+1});
    const topicFreq={};
    items.forEach(f=>{if(f.topic)topicFreq[f.topic]=(topicFreq[f.topic]||0)+1});
    const topTopics=Object.entries(topicFreq).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `
    <div class="card"><h3>${dot(b.competitor)}${b.competitor}</h3>
      <div style="font-size:24px;font-weight:800">${n}<span class="small muted" style="font-weight:400"> feedback items</span></div>
      ${n?`<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 10px">
        ${["positive","mixed","neutral","negative"].map(s=>counts[s]?`<div style="width:${(counts[s]/n*100).toFixed(1)}%;background:${SENT_COL[s][1]}"></div>`:"").join("")}
      </div>
      <div class="small muted" style="margin-bottom:10px">${counts.positive||0} positive · ${counts.negative||0} negative${counts.mixed?" · "+counts.mixed+" mixed":""}${counts.neutral?" · "+counts.neutral+" neutral":""}</div>`:`<div class="small muted" style="margin:8px 0">No feedback collected yet</div>`}
      ${topTopics.length?`<div class="small" style="font-weight:700;margin-bottom:4px">Top topics</div><ul class="tight small">${topTopics.map(([t,c])=>`<li>${esc(t)} (${c})</li>`).join("")}</ul>`:""}
    </div>`}).join("")}
  </div>
  <h2>Feedback feed <span class="small muted" id="vocCount" style="font-weight:400"></span></h2>
  <div class="chips">
    ${BRANDS.map(b=>`<button class="chip on" data-vb="${b.competitor}" style="color:${BCOLOR[b.competitor]}">${b.competitor}</button>`).join("")}
    ${["all","positive","negative","mixed","neutral"].map(s=>`<button class="chip${s==="all"?" on":""}" data-vs="${s}">${s==="all"?"All sentiment":s[0].toUpperCase()+s.slice(1)}</button>`).join("")}
  </div>
  <div class="chips" style="margin-top:-6px">
    <select id="vocSourceSel"><option value="all">All sources</option><option value="Facebook Group">Facebook Group</option><option value="Reddit">Reddit</option></select>
    <select id="vocProdSel"><option value="all">All products</option></select>
    <input type="search" id="vocQ" placeholder="Search topic, summary, forum…" style="flex:1;min-width:200px">
  </div>
  <div id="vocFeed"></div>`;
function vocProdOptions(){
  const prods=Array.from(new Set(VOC.filter(f=>vocBrands.has(f.brand)).map(f=>f.product).filter(Boolean))).sort();
  const sel=sections[8].querySelector("#vocProdSel");
  const cur=sel.value;
  sel.innerHTML=`<option value="all">All products</option>`+prods.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
  sel.value=prods.includes(cur)?cur:"all";
}
function renderVOC(){
  vocProdOptions();
  const rows=VOC.filter(f=>vocBrands.has(f.brand)&&(vocSent==="all"||f.sentiment===vocSent)&&(vocSource==="all"||f.source===vocSource)&&(vocProduct==="all"||f.product===vocProduct)&&(!vocQ||[f.topic,f.summary,f.forum,f.product].join(" ").toLowerCase().includes(vocQ)));
  sections[8].querySelector("#vocCount").textContent=`· ${rows.length} items`;
  sections[8].querySelector("#vocFeed").innerHTML=rows.map(f=>{
    const[bg,fg]=SENT_COL[f.sentiment]||["#222","#999"];
    return `
    <div class="card" style="margin-bottom:12px;border-left:3px solid ${BHEX[f.brand]}">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <span class="small muted" style="font-variant-numeric:tabular-nums;font-weight:700">${esc(f.date||"—")}</span>
        <span class="brandtag small" style="color:${BCOLOR[f.brand]}">${esc(f.brand)}</span>
        <span class="badge" style="background:${bg};color:${fg}">${esc((f.sentiment||"—").toUpperCase())}</span>
        <span class="badge" style="background:var(--panel2);color:var(--text)">${esc(f.topic||"—")}</span>
        ${f.product&&f.product!=="General"?`<span class="small muted">— ${esc(f.product)}</span>`:""}
      </div>
      <div class="small" style="margin-bottom:6px">${esc(f.summary||"")}</div>
      <div class="small muted">${esc(f.source||"")}${f.forum?" · "+esc(f.forum):""}${f.url?` · <a href="${esc(f.url)}" target="_blank">source ↗</a>`:""}</div>
    </div>`}).join("")||`<div class="card muted" style="padding:24px;text-align:center">No feedback matches the filters.</div>`;
}
sections[8].querySelectorAll(".chip[data-vb]").forEach(c=>c.onclick=()=>{const b=c.dataset.vb;c.classList.toggle("on");c.classList.contains("on")?vocBrands.add(b):vocBrands.delete(b);renderVOC()});
sections[8].querySelectorAll(".chip[data-vs]").forEach(c=>c.onclick=()=>{vocSent=c.dataset.vs;sections[8].querySelectorAll(".chip[data-vs]").forEach(x=>x.classList.toggle("on",x===c));renderVOC()});
sections[8].querySelector("#vocSourceSel").onchange=e=>{vocSource=e.target.value;renderVOC()};
sections[8].querySelector("#vocProdSel").onchange=e=>{vocProduct=e.target.value;renderVOC()};
sections[8].querySelector("#vocQ").oninput=e=>{vocQ=e.target.value.toLowerCase();renderVOC()};
renderVOC();

/* ---------- Product Insights (Product Expert agent) ---------- */
const INS=DATA.insights;
const HORIZON_COL={now:["#3d1418","#ff7b72"],next:["#3b2300","#f0a83a"],later:["#1a2634","#79b8ff"]};
const EFFORT_LBL={low:"low effort",medium:"medium effort",high:"high effort"};
if(!INS){
  sections[9].innerHTML=`<div class="card muted" style="padding:32px;text-align:center">The Product Expert agent hasn't generated insights yet. Run the daily refresh (or the agent directly) to populate this page.</div>`;
}else{
  sections[9].innerHTML=`
  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
    <h2 style="margin-top:0">Product Insights</h2>
    <span class="small muted">by the Product Expert agent · generated ${esc(INS.generated||"—")}</span>
  </div>
  ${INS.analyst_note?`<div class="card" style="margin-bottom:16px;border-left:3px solid var(--cardo)"><div class="small" style="font-style:italic">"${linkify(INS.analyst_note)}"</div><div class="small muted" style="margin-top:6px">— Product Expert (consumer-electronics PM)</div></div>`:""}
  <div class="card" style="margin-bottom:24px"><h3>Executive summary</h3><div class="small" style="line-height:1.7;white-space:pre-line">${linkify(INS.executive_summary||"—")}</div></div>

  <h2>Market pulse — what changed & why it matters</h2>
  <div class="card" style="padding:0;margin-bottom:24px">
    <div id="mpHead" style="display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border)">
      <span class="small muted" data-k="date" style="width:80px;flex:none;cursor:pointer;user-select:none;text-transform:uppercase;letter-spacing:.5px;font-size:11px">Date <span class="arrow"></span></span>
      <span class="small muted" data-k="brand" style="width:52px;flex:none;cursor:pointer;user-select:none;text-transform:uppercase;letter-spacing:.5px;font-size:11px">Brand <span class="arrow"></span></span>
      <span class="small muted" style="flex:1;min-width:240px;text-transform:uppercase;letter-spacing:.5px;font-size:11px">Development</span>
    </div>
    <div id="mpList"></div>
  </div>

  <h2>Gap analysis</h2>
  <div class="grid g2" style="margin-bottom:24px">
    ${(INS.gaps||[]).map(g=>`
    <div class="card" style="border-left:3px solid ${({critical:"#f85149",high:"#f0a83a",medium:"#b79df5",low:"#56d364"})[g.severity]||"var(--border)"}">
      <h3>${esc(g.title||"")} <span class="badge b-${esc(g.severity||"low")}">${esc(g.severity||"")}</span> <span class="badge" style="background:var(--panel2);color:var(--muted)">${esc(g.category||"")}</span></h3>
      <div class="small" style="margin-bottom:8px;line-height:1.6">${esc(g.description||"")}</div>
      ${g.evidence&&g.evidence.length?`<div class="small" style="font-weight:700;margin-bottom:4px">Evidence</div><ul class="tight small muted">${g.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}
      ${g.customer_signal?`<div class="small" style="margin-top:8px"><b style="color:var(--partial)">Customer signal:</b> ${esc(g.customer_signal)}</div>`:""}
      ${g.competitor_benchmark?`<div class="small muted" style="margin-top:6px"><b>Benchmark:</b> ${esc(g.competitor_benchmark)}</div>`:""}
      ${g.sources&&g.sources.length?`<div class="small muted" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--divider)">Sources: ${g.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||"source")} ↗</a>`).join(" · ")}</div>`:""}
    </div>`).join("")}
  </div>

  <h2>Recommendations</h2>
  <div class="card reclist" style="margin-bottom:24px">
    ${(INS.recommendations||[]).map(r=>{const[hb,hf]=HORIZON_COL[r.horizon]||["#222","#999"];return `
    <div class="rec">
      <div class="n">${r.priority??"·"}</div>
      <div style="flex:1">
        <b>${esc(r.title||"")}</b>
        <span class="badge" style="background:${hb};color:${hf};margin-left:6px">${esc((r.horizon||"").toUpperCase())}</span>
        ${r.effort?`<span class="badge" style="background:var(--panel2);color:var(--muted);margin-left:4px">${esc(EFFORT_LBL[r.effort]||r.effort)}</span>`:""}
        <div class="small muted" style="margin-top:4px;line-height:1.6">${esc(r.rationale||"")}</div>
        ${r.expected_impact?`<div class="small" style="margin-top:4px"><b style="color:var(--ok)">Impact:</b> ${esc(r.expected_impact)}</div>`:""}
        ${r.addresses_gaps&&r.addresses_gaps.length?`<div class="small muted" style="margin-top:4px">Addresses: ${r.addresses_gaps.map(esc).join(" · ")}</div>`:""}
        ${r.sources&&r.sources.length?`<div class="small muted" style="margin-top:4px">Sources: ${r.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||"source")} ↗</a>`).join(" · ")}</div>`:""}
      </div>
    </div>`}).join("")}
  </div>

  <h2>Watchlist</h2>
  <div class="grid g4">
    ${(INS.watchlist||[]).map(w=>`
    <div class="card">
      <h3 style="color:var(--warn)">◉ ${esc(w.item||"")}</h3>
      <div class="small" style="margin-bottom:6px;line-height:1.6">${esc(w.why||"")}</div>
      <div class="small muted"><b>Trigger:</b> ${esc(w.trigger||"")}</div>
      ${w.sources&&w.sources.length?`<div class="small muted" style="margin-top:6px">Sources: ${w.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||"source")} ↗</a>`).join(" · ")}</div>`:""}
    </div>`).join("")}
  </div>`;
  let mpSortKey="date",mpSortDir=-1;
  function renderMarketPulse(){
    const rows=[...(INS.market_pulse||[])].sort((a,b)=>{
      const x=a[mpSortKey]||"",y=b[mpSortKey]||"";
      return String(x).localeCompare(String(y))*mpSortDir;
    });
    sections[9].querySelectorAll("#mpHead .arrow").forEach(a=>a.textContent="");
    const ah=sections[9].querySelector(`#mpHead [data-k="${mpSortKey}"] .arrow`);if(ah)ah.textContent=mpSortDir>0?"↑":"↓";
    sections[9].querySelector("#mpList").innerHTML=rows.map(m=>`
    <div style="display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--divider);align-items:baseline;flex-wrap:wrap">
      <span class="small muted" style="width:80px;flex:none;font-variant-numeric:tabular-nums;font-weight:700">${esc(m.date||"—")}</span>
      <span class="brandtag small" style="color:${BCOLOR[m.brand]||"var(--muted)"};width:52px;flex:none">${esc(m.brand||"")}</span>
      <span class="small" style="flex:1;min-width:240px;line-height:1.6"><b>${esc(m.development||"")}</b><br><span class="muted">→ ${esc(m.implication||"")}</span>${m.sources&&m.sources.length?`<br><span class="muted">Sources: ${m.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||"source")} ↗</a>`).join(" · ")}</span>`:""}</span>
    </div>`).join("");
  }
  sections[9].querySelectorAll("#mpHead [data-k]").forEach(h=>h.onclick=()=>{
    const k=h.dataset.k;mpSortDir=(mpSortKey===k)?-mpSortDir:(k==="date"?-1:1);mpSortKey=k;renderMarketPulse();
  });
  renderMarketPulse();
}

show(0);
</script>
</body>
</html>
</script>
