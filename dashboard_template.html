<style>
/* ===== Cardo Intel · command center (dark) ===== */
:root {
  color-scheme: dark;
  --color-bg: #111113;
  --panel: #18181b;
  --panel-2: #1f1f23;
  --hover: #232328;
  --active: #2a2a30;
  --color-surface: #1f1f23;
  --color-text: #ececee;
  --color-divider: #2a2a2f;
  --rule: #232327;
  --muted: #ababb1;
  --faint: #939399;
  --color-accent: #378ADD;
  --color-accent-100: #102338;
  --color-accent-200: #132c47;
  --color-accent-300: #1b3d63;
  --color-accent-400: #2f6db0;
  --color-accent-500: #378ADD;
  --color-accent-600: #4d9ae6;
  --color-accent-700: #85B7EB;
  --color-accent-800: #B5D4F4;
  --color-accent-900: #E6F1FB;
  --color-accent-2-100: #221d4a;
  --color-accent-2-800: #CECBF6;
  --color-neutral-100: #1c1c20;
  --color-neutral-200: #26262b;
  --color-neutral-300: #34343a;
  --color-neutral-400: #4a4a51;
  --color-neutral-500: #66666d;
  --color-neutral-600: #85858c;
  --color-neutral-700: #9a9aa0;
  --color-neutral-800: #c9c9ce;
  --color-neutral-900: #ececee;
  --danger: #E24B4A; --danger-text: #F09595; --danger-bg: #3a1515;
  --warn: #EF9F27; --warn-text: #FAC775; --warn-bg: #3a2a0e;
  --ok: #5DCAA5;
  --c-cardo: #378ADD; --c-sena: #EF9F27; --c-asmax: #5DCAA5; --c-reso: #AFA9EC;
  --font-heading: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow-md: 0 12px 40px rgb(0 0 0 / 50%);
  --sbw: 224px;
  --pad: 24px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 8px; }
h1 { font-size: 26px; } h2 { font-size: 20px; } h3 { font-size: 17px; } h4 { font-size: 14px; } h5 { font-size: 14px; }
h6 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; color: var(--muted); }
p { margin: 0 0 10px; }
a { color: var(--color-accent-700); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 40%, transparent); }
kbd { font: 500 11px/1 var(--font-body); border: 1px solid #3a3a40; border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--muted); background: var(--panel-2); }

/* primitives */
.ic { display: inline-block; vertical-align: -3px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted, .text-muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
.plain { all: unset; cursor: pointer; box-sizing: border-box; }
.plain:focus-visible, .linkbtn:focus-visible, .seg button:focus-visible, .legend button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.linkbtn { all: unset; cursor: pointer; color: var(--color-accent-700); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.linkbtn:hover { color: var(--color-accent-800); }
a.more, .more { color: var(--color-accent-700); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
a.more:hover { color: var(--color-accent-800); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; font: 500 13px/1.2 var(--font-body); color: var(--color-text); background: var(--panel-2); border: 1px solid var(--color-divider); padding: 8px 12px; border-radius: 6px; }
.btn:hover { background: var(--active); }
.btn-primary { background: #2f6db0; border-color: #2f6db0; color: #fff; }
.btn-primary:hover { background: #285f9a; }
.btn-secondary { background: var(--panel-2); }
.blueprint > .corner { display: none; }
.input { width: 100%; min-height: 32px; padding: 5px 10px; font: 13px var(--font-body); color: var(--color-text); background: var(--panel-2); border: 1px solid #66666d; border-radius: 6px; }
.input:hover { border-color: #85858c; }
.input:focus-visible { border-color: var(--color-accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 25%, transparent); }
select.input { width: auto; max-width: 220px; padding-right: 26px; text-overflow: ellipsis; }
.searchbox { position: relative; display: inline-flex; align-items: center; min-width: 0; }
.searchbox .ic { position: absolute; left: 10px; color: var(--faint); pointer-events: none; }
.searchbox .input { padding-left: 32px; }
.seg { display: inline-flex; border: 1px solid var(--color-divider); border-radius: 7px; background: var(--panel); padding: 2px; gap: 2px; }
.page-head .seg, .seg.scroll { max-width: 100%; overflow-x: auto; }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; font-size: 13px; border-radius: 5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button:hover { color: var(--color-text); }
.seg button[aria-pressed="true"] { background: var(--active); color: var(--color-text); box-shadow: 0 1px 0 rgb(255 255 255 / 4%) inset; }
.seg.sm button { padding: 3px 9px; font-size: 12px; }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-700); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-200); color: var(--color-neutral-800); }
.tag-outline { box-shadow: inset 0 0 0 1px var(--color-accent-400); color: var(--color-accent-700); }
.tag-social { background: #13302a; color: #9FE1CB; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 6px; background: var(--color-accent-100); color: var(--color-accent-800); }
.chip button { all: unset; cursor: pointer; display: inline-flex; padding: 2px; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; color: var(--muted); }
.check input { accent-color: var(--color-accent); width: 15px; height: 15px; margin: 0; }
.ext { white-space: nowrap; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--color-divider); white-space: nowrap; }
.table td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.table tbody tr:hover { background: var(--panel-2); }
.tt { position: fixed; z-index: 70; pointer-events: none; display: none; max-width: 300px; background: var(--tt-bg, #26262b); border: 1px solid #3a3a40; border-radius: 8px; color: var(--color-text); font-size: 12px; line-height: 1.45; padding: 8px 11px; box-shadow: var(--shadow-md); }
.tt b { font-weight: 600; }

/* shell */
.shell { display: grid; grid-template-columns: var(--sbw) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--sb-bg, #141416); border-right: 1px solid var(--color-divider); padding: 14px 10px; display: flex; flex-direction: column; gap: 16px; }
.sb-brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; color: var(--color-text); text-decoration: none; padding: 4px 10px; }
.mark { width: 10px; height: 10px; background: var(--c-cardo); border-radius: 2px; display: block; }
.sb-search { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 1px solid var(--color-divider); border-radius: 7px; background: var(--panel); color: var(--faint); font-size: 13px; cursor: pointer; }
.sb-search:hover { border-color: #3a3a40; color: var(--muted); }
.sb-search kbd { margin-left: auto; }
.sb-search:focus-visible { outline: 2px solid var(--color-accent); }
.sb-nav { display: flex; flex-direction: column; gap: 2px; }
.sb-nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500; }
.sb-nav a:hover { background: var(--hover); color: var(--color-text); }
.sb-nav a[aria-current="page"] { background: var(--active); color: var(--color-text); }
.sb-nav .r { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.sb-nav .badge { background: var(--danger-bg); color: var(--danger-text); border-radius: 9px; padding: 0 7px; font-size: 11px; line-height: 18px; }
.sb-nav kbd { opacity: 0; transition: opacity .15s; }
.sidebar:hover .sb-nav kbd, .sb-nav a:focus-visible kbd { opacity: 1; }
.sb-lbl { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; padding: 0 10px; margin-bottom: 6px; }
.legend { display: flex; flex-direction: column; gap: 2px; }
.legend button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 5px 10px; border-radius: 6px; font-size: 13px; }
.legend button:hover { background: var(--hover); }
.legend button[aria-pressed="false"] { color: var(--faint); }
.legend button[aria-pressed="false"] .bm { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--faint); }
.legend .st { margin-left: auto; font-size: 11px; color: var(--faint); }
.sb-foot { margin-top: auto; font-size: 11px; color: var(--faint); padding: 0 10px; line-height: 1.5; }
.bm { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: none; }
.bm-lg { width: 11px; height: 11px; }
.bm-cardo { background: var(--c-cardo); } .bm-sena { background: var(--c-sena); } .bm-asmax { background: var(--c-asmax); } .bm-reso { background: var(--c-reso); }
.b-cardo { --bc: var(--c-cardo); } .b-sena { --bc: var(--c-sena); } .b-asmax { --bc: var(--c-asmax); } .b-reso { --bc: var(--c-reso); }
.brand { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; white-space: nowrap; }

/* page frame + panels */
main { display: block; min-width: 0; }
.page { max-width: 1520px; padding: 20px var(--pad) 48px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head h2 { margin: 0 6px 0 0; }
.spacer { flex: 1; }
.pnl, .split > .main, .split > .side, .rail, .sig-main, .cols3 > div, .profile > div, .hero, .matchup, .blueprint { background: var(--panel); border: 1px solid var(--color-divider); border-radius: 10px; padding: 16px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 12px; align-items: start; }
.rows > * + * { border-top: 1px solid var(--rule); }
.empty { padding: 24px 0; color: var(--muted); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.sec-head h4 { margin: 0; font-size: 14px; }

/* brief */
.brief-hero { margin-bottom: 12px; }
.kicker { color: var(--color-accent-700); margin-bottom: 8px; }
.headline { font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; margin-bottom: 10px; max-width: 1050px; }
.headline.long { font-size: 19px; }
.lead { font-size: 14px; line-height: 1.6; color: var(--color-neutral-800); max-width: 1050px; margin-bottom: 8px; }
.lead.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.brief-tog { display: flex; gap: 18px; flex-wrap: wrap; }
.exec { margin-top: 12px; padding: 14px 16px; font-size: 13.5px; line-height: 1.7; white-space: pre-line; max-width: 1050px; background: var(--panel-2); border-radius: 8px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 12px; }
.kpi { background: var(--panel); border: 1px solid var(--color-divider); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.kpi .lbl { margin: 0; }
.kpi .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
.kpi .v.long { font-size: 20px; line-height: 1.5; white-space: nowrap; }
.kpi .n { font-size: 12px; color: var(--muted); line-height: 1.45; }
.kpi .bar { height: 4px; background: var(--active); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.kpi .bar i { display: block; height: 4px; background: var(--danger); border-radius: 2px; }
.brief { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; align-items: start; }
.brief > div, .brief > aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chg { display: grid; grid-template-columns: 56px 78px minmax(0, 1fr); gap: 10px; padding: 11px 0; width: 100%; text-align: left; }
.chg .d { font-size: 12px; color: var(--faint); padding-top: 1px; }
.chg .e { font-size: 13.5px; line-height: 1.45; }
.chg .w { font-size: 12.5px; color: var(--color-accent-700); margin-top: 3px; line-height: 1.45; }
.chg .full { font-size: 13px; line-height: 1.6; margin-top: 8px; color: var(--color-neutral-800); }
.chg:hover .e { color: var(--hi, #fff); }
.srcs { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.srcs a { color: var(--color-accent-700); }
.chg-src { padding: 0 0 12px 144px; }
.srcs .ext { white-space: normal; overflow-wrap: anywhere; }
.lsig { display: grid; grid-template-columns: 50px 76px 74px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: 13px; align-items: center; }
.lsig .d { font-size: 12px; color: var(--faint); }
.lsig .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--color-text); text-decoration: none; }
.lsig a.t:hover { color: var(--color-accent-700); }
.donow h4 { margin: 0; }
.rec { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 0; width: 100%; text-align: left; }
.rec .no { font-weight: 600; font-size: 13px; line-height: 20px; color: var(--color-accent-700); }
.rec .t { font-size: 13.5px; line-height: 1.45; }
.rec .m { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
.rec .body { font-size: 13px; line-height: 1.55; margin-top: 8px; color: var(--color-neutral-800); }
.rec:hover .t { color: var(--hi, #fff); }
.watch { padding: 10px 0; }
.watch .t { font-size: 13.5px; font-weight: 500; line-height: 1.4; }
.watch .m { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.45; }

/* products */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -4px 0 12px; }
.filters .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.map-legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.map-legend .sq { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; margin-right: 6px; border-radius: 2px; border: 1.5px solid var(--color-neutral-800); }
.map-legend .sq.f { background: var(--color-neutral-800); }
.lad { display: grid; grid-template-columns: 90px minmax(0, 1fr); }
.lad-brand { display: flex; align-items: center; font-size: 13px; }
.lad-track { position: relative; height: 76px; margin: 0 16px; }
.lad-track::before { content: ""; position: absolute; left: -16px; right: -16px; top: 50%; height: 1px; background: var(--color-divider); }
.lad-tint { position: absolute; top: 14px; bottom: 14px; left: -16px; background: color-mix(in srgb, var(--c-cardo) 10%, transparent); border-radius: 4px; }
.lad-note { position: relative; height: 26px; margin: 0 16px; }
.bracket { position: absolute; left: -16px; top: 6px; height: 12px; border: 1px solid var(--color-accent-400); border-bottom: 0; border-radius: 3px 3px 0 0; }
.bracket span { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--panel); padding: 0 8px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--color-accent-700); white-space: nowrap; }
.pt { all: unset; position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; box-sizing: border-box; border: 1.5px solid var(--bc); background: var(--bc); border-radius: 3px; cursor: pointer; z-index: 2; }
.pt.bt { background: var(--panel); }
.pt:hover { transform: scale(1.3); }
.pt.sel { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px #fff; z-index: 3; }
.pt:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.pl { position: absolute; transform: translateX(-50%); font-size: 11px; line-height: 1.2; text-align: center; white-space: nowrap; color: var(--color-neutral-800); pointer-events: none; }
.pl small { display: block; font-size: 10px; color: var(--faint); }
.pl.up { bottom: calc(50% + 9px); }
.pl.dn { top: calc(50% + 9px); }
.pl.l { transform: none; text-align: left; }
.pl.r { transform: translateX(-100%); text-align: right; }
.pl.hid { visibility: hidden; }
.pl.sel { font-weight: 600; color: var(--hi, #fff); z-index: 4; }
.lad-axis { position: relative; height: 26px; margin: 0 16px; border-top: 1px solid var(--color-neutral-400); }
.lad-axis span { position: absolute; top: 6px; transform: translateX(-50%); font-size: 11px; color: var(--faint); }
.unpriced { font-size: 12px; color: var(--muted); margin-top: 10px; }
.sel-kicker { color: var(--color-accent-700); margin-bottom: 4px; }
.sel-name { font-size: 20px; margin: 0 0 6px; }
.sel-price { font-weight: 600; font-size: 26px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.strike { text-decoration: line-through; color: var(--faint); font-size: 14px; font-weight: 400; }
.specs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin: 14px 0 18px; }
.specs > div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.specs .k { font-size: 11px; color: var(--faint); }
.specs .v { font-size: 13px; line-height: 1.35; margin-top: 2px; }
.rivals td, .rivals th { padding: 7px 6px 7px 0; font-size: 12px; }
.delta { font-size: 11px; color: var(--danger-text); display: block; }
.btn-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.btn-stack .btn { width: 100%; }
.btn.blueprint { padding: 9px 12px; border-radius: 6px; background: #2f6db0; border-color: #2f6db0; }
.btn.blueprint:hover { background: #285f9a; }
.tbl-wrap { overflow-x: auto; }
tr.prod { cursor: pointer; }
tr.prod td:first-child { font-weight: 500; }
tr.expand td { background: var(--panel-2); font-size: 13px; line-height: 1.6; }
.th-sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.th-sort:hover { color: var(--color-text); }
.th-sort:focus-visible { outline: 2px solid var(--color-accent); }
.gap-hd .th-sort, .gap-hd > span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
.seg-strip { display: flex; overflow-x: auto; gap: 4px; border-bottom: 1px solid var(--color-divider); margin: 0 0 12px; }
.seg-strip button { all: unset; cursor: pointer; padding: 9px 11px; font-size: 13px; white-space: nowrap; border-bottom: 2px solid transparent; color: var(--muted); }
.seg-strip button:hover { color: var(--color-text); }
.seg-strip button[aria-selected="true"] { border-bottom-color: var(--color-accent); color: var(--color-text); font-weight: 500; }
.seg-strip button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
.bat-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

.gl { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; border-radius: 3px; }

.matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
.matrix th, .matrix td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--rule); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }

.matchup h5 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 6px; }

.quote { border-left: 2px solid var(--color-accent-400); padding-left: 10px; color: var(--color-neutral-800); font-style: italic; margin: 8px 0; }

/* signals */
.sig { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; align-items: start; }
.rail { position: sticky; top: 16px; padding: 12px; }
.rail .typebtn { all: unset; cursor: pointer; display: flex; justify-content: space-between; width: 100%; box-sizing: border-box; padding: 6px 10px; font-size: 13.5px; border-radius: 6px; color: var(--muted); }

.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cols3 h4, .profile h4 { font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.sw { all: unset; cursor: pointer; display: block; box-sizing: border-box; width: 100%; padding: 9px 0; font-size: 13.5px; line-height: 1.45; }

/* command palette */
.cmd { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / 55%); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.cmd[hidden] { display: none; }

.cmd-list { max-height: min(440px, 60vh); overflow-y: auto; padding: 6px; margin: 0; list-style: none; }
.cmd-g { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; padding: 8px 10px 4px; }
.cmd-o { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.cmd-o .ic { color: var(--faint); }
.cmd-o .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd-o .s { flex: none; color: var(--faint); font-size: 12px; white-space: nowrap; padding-left: 12px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.cmd-o[aria-selected="true"] { background: var(--active); }
.cmd-empty { padding: 18px 12px; color: var(--muted); font-size: 13px; }
.cmd-foot { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid var(--color-divider); font-size: 11px; color: var(--faint); }

/* themes (Display menu) */
[data-theme="light"], [data-theme="sepia"] { color-scheme: light; --color-bg: #f6f6f7; --panel: #ffffff; --panel-2: #f1f1f3; --hover: #ececef; --active: #e2e2e7; --color-surface: #ffffff; --color-text: #18181b; --color-divider: #d6d6db; --rule: #e6e6ea; --muted: #52525b; --faint: #63636b; --color-accent-100: #e6f1fb; --color-accent-200: #cfe3f7; --color-accent-300: #b5d4f4; --color-accent-400: #5b9bd8; --color-accent-700: #1d5c99; --color-accent-800: #174a7c; --color-accent-900: #0e3156; --color-accent-2-100: #ecebfb; --color-accent-2-800: #3c3489; --color-neutral-100: #f4f4f5; --color-neutral-200: #e9e9ec; --color-neutral-300: #d4d4d8; --color-neutral-400: #a1a1aa; --color-neutral-500: #71717a; --color-neutral-600: #52525b; --color-neutral-700: #3f3f46; --color-neutral-800: #27272a; --color-neutral-900: #18181b; --danger-text: #b42318; --danger-bg: #fde8e8; --warn-text: #8a5a00; --warn-bg: #fdf1dc; --ok: #13795b; --sb-bg: #fbfbfc; --tt-bg: #ffffff; --hi: #000000; --shadow-md: 0 12px 40px rgb(0 0 0 / 15%); }
[data-theme="sepia"] { --color-bg: #f4ecd8; --panel: #fbf5e6; --panel-2: #efe5cc; --hover: #ebe0c4; --active: #e3d6b5; --color-surface: #fbf5e6; --color-text: #3b2f1e; --color-divider: #d6c7a2; --rule: #e6dbbf; --muted: #5e4f37; --faint: #6b5b42; --sb-bg: #f0e6cf; --tt-bg: #fbf5e6; }
[data-theme="midnight"] { --color-bg: #0b1020; --panel: #111831; --panel-2: #172042; --hover: #1c2750; --active: #233063; --color-surface: #172042; --color-divider: #2a3666; --rule: #1f2a52; --sb-bg: #0d1328; --tt-bg: #172042; }
[data-theme="nord"] { --color-bg: #2e3440; --panel: #3b4252; --panel-2: #434c5e; --hover: #4c566a; --active: #4c566a; --color-surface: #434c5e; --color-text: #eceff4; --color-divider: #566075; --rule: #4c566a; --muted: #d8dee9; --faint: #c3cad8; --sb-bg: #2b303b; --tt-bg: #434c5e; }
[data-theme="contrast"] { --color-bg: #000; --panel: #000; --panel-2: #111; --hover: #1a1a1a; --active: #262626; --color-surface: #111; --color-text: #fff; --color-divider: #bdbdbd; --rule: #6b6b6b; --muted: #ededed; --faint: #d6d6d6; --color-accent-700: #a8d4ff; --color-accent-800: #cfe7ff; --color-neutral-800: #f2f2f2; --sb-bg: #000; --tt-bg: #111; }
.sb-disp { display: flex; gap: 6px; align-items: center; padding: 0 10px; flex-wrap: wrap; }
.sb-disp select.input { flex: 1; min-height: 28px; font-size: 12px; padding: 2px 6px; }
.sb-nav .nl { display: flex; flex-direction: column; line-height: 1.25; }
.sb-nav .nd { font-size: 11px; color: var(--faint); font-weight: 400; }
.sb-sub { display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px 30px; }
.sb-sub a { padding: 4px 10px !important; font-size: 12.5px !important; }
.cheap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.cheap .pick { display: inline-flex; gap: 6px; align-items: center; }
.pt.tier-flagship { clip-path: polygon(50% 0, 100% 100%, 0 100%); border-radius: 0; background: var(--bc); }
.pt.tier-mid { border-radius: 1px; background: var(--bc); }
.pt.tier-entry, .pt.tier-none { border-radius: 50%; background: var(--bc); }
.catdd { position: relative; }

.catpop { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; background: var(--panel); border: 1px solid var(--color-divider); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 220px; box-shadow: var(--shadow-md); }

.cbar { display: block; height: 4px; background: var(--active); border-radius: 2px; margin-top: 5px; max-width: 140px; overflow: hidden; }

.cbar.acc i { background: var(--color-accent); } .cbar.neg i { background: var(--danger); }
.gtbl td { font-size: 12.5px; line-height: 1.5; min-width: 120px; }

/* responsive */

}

  .legend button { padding: 3px 8px; font-size: 12px; }

  .brief, .split, .sig { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .rail .lbl { width: 100%; }
  .rail .typebtn { width: auto; gap: 8px; border: 1px solid var(--color-divider); padding: 5px 10px; font-size: 13px; }
  .rail .theme { width: calc(50% - 4px); }
  .headline { font-size: 19px; }
  .headline.long { font-size: 17px; }
  .chg { grid-template-columns: 50px minmax(0, 1fr); }
  .chg .b { grid-column: 2; grid-row: 1; }
  .chg .x { grid-column: 2; }
  .lsig { grid-template-columns: 46px minmax(0, 1fr); gap: 4px 10px; }
  .lsig .ty { display: none; }
  .lsig .t { grid-column: 1 / -1; white-space: normal; }
  .gap-hd { display: none; }
  .gap-row { grid-template-columns: minmax(0, 1fr) 20px; gap: 6px 10px; }
  .gap-row > * { grid-column: 1; }
  .gap-row .gap-chev { grid-column: 2; grid-row: 1; }
  .gap-body { grid-template-columns: minmax(0, 1fr); padding: 4px 8px 16px; gap: 14px; }
  .sig-row { grid-template-columns: 70px minmax(0, 1fr); gap: 4px 10px; }
  .sig-row .ty { grid-column: 2; grid-row: 1; }
  .sig-row .tx { grid-column: 1 / -1; }
  .sig-row .src { grid-column: 1 / -1; text-align: left; }
  .lad { grid-template-columns: 60px minmax(0, 1fr); }
  .lad-brand { font-size: 12px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols3, .profile { grid-template-columns: minmax(0, 1fr); }
  .glegend { margin-left: 0; }
}
@media (max-width: 520px) {
  .sb-nav a { flex: 1; justify-content: center; padding: 8px 6px; }
  .sb-nav .nl { display: none; }
  .sb-nav .r { margin-left: 4px; }

      <span class="seg sm" role="group" aria-label="Text size"><button type="button" id="fontDec" aria-label="Smaller text">A−</button><button type="button" id="fontInc" aria-label="Larger text">A+</button></span></div></div>

</div>

/* dates: "2026-10-05", "2026-07", "2026" or free text containing one */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/* products (same derivations as the previous dashboard) */
const PRODUCTS = [];
BRANDS.forEach(br => br.products.forEach(p => PRODUCTS.push({brand: br.competitor, ...p})));
PRODUCTS.forEach(p => {
  p.eff = (p.street_price_usd ?? p.msrp_usd);
  p.isHelmet = /helmet/i.test(p.name);
  p.isHeadphone = /headphone|edgephones|ridephones|tufftalk|earbud/i.test(p.name);

  /* adapters and cameras that only connect to an intercom are not communicators */

  p.cat = p.category || (p.isHelmet ? "smart_helmet" : p.isHeadphone ? "headphones" : p.isOutdoor ? "outdoor" : p.isAccessory ? "accessory" : "communicator");
  p.usage = p.usage || "Motorcycle";
  p.mesh = /mesh|dmc/i.test(p.intercom_tech || "") && !/no (hardware )?mesh/i.test(p.intercom_tech || "") && !p.isAccessory;

const PROD_BY = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const CAT_LABEL = {communicator: "Communicators", smart_helmet: "Smart helmets", smart_helmet_accessory: "Helmet-integrated units", headphones: "Headphones", outdoor: "Outdoor", accessory: "Adapters & cameras"};
const CATS = [...new Set(PRODUCTS.map(p => p.cat))].sort((a, b) => (Object.keys(CAT_LABEL).indexOf(a) + 99 * !(a in CAT_LABEL)) - (Object.keys(CAT_LABEL).indexOf(b) + 99 * !(b in CAT_LABEL)));
const inCat = (p, c) => c === "all" || String(c).split(",").includes(p.cat);
const catLabel = c => CAT_LABEL[c] || cap(String(c).replace(/_/g, " "));
const TIER_ORDER = ["flagship", "mid", "entry"];
const YEARS = [...new Set(PRODUCTS.map(p => p.release_year).filter(Boolean))].sort((a, b) => b - a);
const USAGES = [...new Set(PRODUCTS.map(p => p.usage))].sort((a, b) => a === "Motorcycle" ? -1 : b === "Motorcycle" ? 1 : a.localeCompare(b));
const isMotoMesh = p => p.cat === "communicator" && p.mesh && /motorcycle/i.test(p.usage) && p.eff != null;
const cheapest = list => list.reduce((a, p) => (!a || p.eff < a.eff) ? p : a, null);
const cheapestMoto = b => cheapest(PRODUCTS.filter(p => p.brand === b && isMotoMesh(p)));
/* a brand's flagship = its cheapest flagship-tier, universal (non-OEM) motorcycle communicator */
const flagshipOf = b => cheapest(PRODUCTS.filter(p => p.brand === b && p.tier === "flagship" && p.cat === "communicator" && !p.oem && /^motorcycle$/i.test(p.usage) && p.eff != null));

/* firmware per product */
const FW_BY = {};
BRANDS.forEach(b => (b.product_firmware || []).forEach(f => { FW_BY[b.competitor + "|" + normName(f.product)] = f; }));
const fwFor = p => FW_BY[p.brand + "|" + normName(p.name)] || null;

/* signals: the single feed of news, press, software, owner posts and social posts */
const TYPES = [["all", "All"], ["news", "News"], ["press", "Press"], ["software", "Software"], ["owners", "Owners"], ["social", "Social"]];
const TYPE_TAG = {news: ["tag-accent", "News"], press: ["tag-outline", "Press"], software: ["tag-neutral", "Software"], owners: ["tag-accent-2", "Owners"], social: ["tag-social", "Social"]};
const SIG = [];
BRANDS.forEach(b => {
  const br = b.competitor;
  (b.recent_news || []).forEach(n => SIG.push({type: "news", brand: br, date: n.date, text: n.headline, source: n.source || dom(n.url) || "News", url: n.url}));
  (b.press_coverage?.reviews || []).forEach(r => SIG.push({type: "press", brand: br, date: r.date, text: (r.product ? r.product + " — " : "") + (r.verdict || ""), source: r.outlet || dom(r.url) || "Press", url: r.url, product: r.product}));

SIG.forEach((s, i) => {

  s.nurl = normUrl(s.url);

/* gaps: weekly insights gaps (numbered) + July baseline gaps from gap_analysis.json */
const RECS = (INS?.recommendations || []).slice().sort((a, b) => (a.priority ?? 99) - (b.priority ?? 99));
const GAPS = [];
(INS?.gaps || []).forEach((g, i) => GAPS.push({id: "w" + i, src: "weekly", title: g.title, severity: g.severity, cat: g.category || "other", g, recs: RECS.filter(r => (r.addresses_gaps || []).includes(g.title))}));

SIG.forEach(s => { if (s.nurl) (SIG_BY_URL[s.nurl] = SIG_BY_URL[s.nurl] || []).push(s); });

/* battles: pool every rated model so any model can be swapped into any battle */

const POOL_KEYS = Object.keys(RATED_POOL).sort((a, b) => RATED_POOL[a].brand.localeCompare(RATED_POOL[b].brand) || RATED_POOL[a].model.localeCompare(RATED_POOL[b].model));
const SCORE_N = {good: 2, soso: 1, bad: 0};

/* price for a battle model comes from the product data; battles.json price text is only a fallback */

/* ================= state + routing ================= */

const S = {

  battles: {idx: 0, models: null, mode: "rank", swapOpen: null, notes: false},

const ROUTES = [["brief", "Brief"], ["products", "Products"], ["gaps", "Gaps"], ["signals", "Signals"], ["brands", "Brands"]];

function buildHash() {
  const q = new URLSearchParams();
  let path = "#/" + S.route;
  if (S.route === "products") {
    path += "/" + S.products.mode;
    if (S.products.mode === "battles" && BAT.battles[S.battles.idx]) path += "/" + encodeURIComponent(BAT.battles[S.battles.idx].id);
    if (S.products.mode === "map" && S.products.selectedId) q.set("id", S.products.selectedId);
  } else if (S.route === "gaps") {
    if (S.gaps.expandedId) q.set("open", S.gaps.expandedId);
    if (S.gaps.baseline && (INS?.gaps || []).length) q.set("baseline", "1");
  } else if (S.route === "signals") {
    const s = S.signals;
    if (s.type !== "all") q.set("type", s.type);
    if (s.range !== SIG_DEF) q.set("range", s.range);
    if (s.query) q.set("q", s.query);
    if (s.brand) q.set("brand", s.brand);
    if (s.gap) q.set("gap", s.gap);
  } else if (S.route === "brands") {

}
const syncHash = () => { const h = buildHash(); if (location.hash !== h) history.replaceState(null, "", h); };

function applyHash() {

function briefKPIs() {
  const gen = parseD(INS?.generated)?.t ?? REF_T;
  const out = [];
  /* 1. Cardo flagship firmware age */
  const flag = PRODUCTS.filter(p => p.brand === "Cardo" && p.tier === "flagship");
  const fws = flag.map(p => ({p, f: fwFor(p)})).filter(x => x.f && parseD(x.f.firmware_last_updated)?.da);
  if (fws.length) {
    const latest = Math.max(...fws.map(x => parseD(x.f.firmware_last_updated).t));
    const on = fws.filter(x => parseD(x.f.firmware_last_updated).t === latest);
    const names = on.map(x => x.p.name);
    const ver = on[0].f.firmware_version ? "v" + String(on[0].f.firmware_version).split(/[\s(]/)[0] + " " : "";
    out.push({l: "Cardo flagship firmware", v: daysBetween(latest, gen) + " days", n: `Latest flagship release ${ver}on ${fmtDay(on[0].f.firmware_last_updated)} (${names.slice(0, 3).join(", ")}${names.length > 3 ? " +" + (names.length - 3) : ""})`});
  }
  /* 2. rival flagships vs Cardo's flagship (cheapest universal flagship-tier unit per brand) */
  const cf = flagshipOf("Cardo");
  const rf = cf ? BN.filter(b => b !== "Cardo").map(flagshipOf).filter(Boolean) : [];
  if (cf && rf.length) {
    const sd = d => (d < 0 ? "−" : "+") + money0(Math.abs(d));
    const ds = rf.map(p => p.eff - cf.eff), lo = Math.min(...ds), hi = Math.max(...ds);
    out.push({l: `Rival flagships vs ${cf.name}`, v: lo === hi ? sd(lo) : `${sd(hi)} to ${sd(lo)}`, n: rf.map(p => `${fullName(p)} ${fmt$(p.eff)} (${sd(p.eff - cf.eff)})`).join(" · ") + ` · vs ${fmt$(cf.eff)}`});
  }
  /* 3. cheapest Cardo motorcycle mesh unit and the rival mesh units below it */
  const cm = cheapestMoto("Cardo");
  if (cm) {
    const under = PRODUCTS.filter(p => p.brand !== "Cardo" && isMotoMesh(p) && p.eff < cm.eff);
    const by = BN.filter(b => b !== "Cardo").map(b => `${b} ${under.filter(p => p.brand === b).length}`).join(", ");
    out.push({l: "Cheapest Cardo mesh", v: money0(cm.eff), n: `${cm.name} ${fmt$(cm.eff)} · ${under.length} rival mesh units cost less (${by})`});
  }
  /* 4. Cardo owner sentiment */
  const fb = BRAND_BY.Cardo?.customer_feedback || [];
  if (fb.length) {
    const neg = fb.filter(f => f.sentiment === "negative").length;
    out.push({l: "Cardo owner posts", v: Math.round(neg / fb.length * 100) + "% neg.", n: `${neg} of ${fb.length} posts · self-selected owner forums`, bar: neg / fb.length});
  }
  return out;
}

function renderPBody() {

          <span class="pl ${i % 2 ? "dn" : "up"}${al}${on ? " sel" : ""}" style="left:${x}%" data-for="${esc(p.id)}">${esc(p.name.replace(/\s*\(.*\)/, ""))}<small>${fmt$(p.eff)}</small></span>`;
      }).join("")}</div>`;

  el.innerHTML = `<div class="split"><div class="main">
    ${unplotted ? `<p class="small" style="color:var(--color-accent-700)">${esc(fullName(unplotted))} has no published price, so it is not on the map. See the Table.</p>` : ""}
    ${cheapList.length ? `<div class="lbl" style="margin-bottom:6px">Cheapest motorcycle mesh unit per brand</div><div class="cheap">${cheapList.map(c => `<button type="button" class="pick" data-cheap="${esc(c.id)}" aria-pressed="${c.id === P.selectedId}">${bm(c.brand)}${esc(c.brand)} · ${esc(c.name)} <b class="num">${fmt$(c.eff)}</b></button>`).join("")}</div>` : ""}
    <div class="map-legend"><span class="seg sm" role="group" aria-label="Mark products by"><button type="button" data-mark="mesh" aria-pressed="${!tierMode}">Mesh</button><button type="button" data-mark="tier" aria-pressed="${tierMode}">Tier</button></span>${tierMode ? `<span>▲ Flagship</span><span>■ Mid</span><span>● Entry / other</span>` : `<span><i class="sq f"></i>Mesh</span><span><i class="sq"></i>Bluetooth only</span>`}<span>Street price where verified, else MSRP · hover for detail · click to select</span></div>
    <div class="lad">

    <div class="btn-stack">

  bindTT(el, ".pt", b => { const p = PROD_BY[b.dataset.id]; return `<b>${esc(fullName(p))}</b><br>${fmt$(p.eff)}${p.street_price_usd != null && p.msrp_usd != null && p.street_price_usd !== p.msrp_usd ? " street · MSRP " + fmt$(p.msrp_usd) : p.street_price_usd == null ? " MSRP" : ""}<br>${esc(p.tier || catLabel(p.cat))} · ${p.mesh ? "mesh" : "Bluetooth only"}${p.max_riders ? " · " + esc(p.max_riders) + " riders" : ""}`; });
  layoutLabels(el);
}
function layoutLabels(el) {
  el.querySelectorAll(".lad-track").forEach(track => {
    ["up", "dn"].forEach(side => {
      const labels = [...track.querySelectorAll(".pl." + side)].map(l => ({l, r: l.getBoundingClientRect()})).sort((a, b) => a.r.left - b.r.left);
      let last = null;
      labels.forEach(cur => {
        if (last && cur.r.left < last.r.right + 6) {
          if (cur.l.classList.contains("sel") && !last.l.classList.contains("sel")) { last.l.classList.add("hid"); last = cur; }
          else cur.l.classList.add("hid");

function nearestRivals(sel) {

  return PRODUCTS.filter(p => p.brand !== sel.brand && S.brands.has(p.brand) && p.cat === sel.cat && p.eff != null)
    .sort((a, b) => Math.abs(a.eff - sel.eff) - Math.abs(b.eff - sel.eff)).slice(0, 3);
}

    <p class="xs muted" style="margin-top:10px">Hover a dimension for its sub-criteria and the analyst note. Click a column header to swap in any rated model; + adds a column. * = pending testing / verification.</p>
    <div class="matchups">${(b.matchups || []).map(m => `<div class="blueprint matchup">${corners}
      <h5>${bm(m.brand)}${esc(fullName({brand: m.brand, name: m.model}))}<span class="muted small" style="margin-left:auto;font-family:var(--font-body);font-weight:400">${battlePrice(m.brand, m.model, m.price)}</span></h5>
      <div class="small muted" style="line-height:1.5">${esc(m.blurb || "")}</div>
      <div class="lbl" style="margin-top:12px">Cardo's advantage</div><ul>${(m.cardo_advantage || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul>
      <div class="lbl">Competitor's advantage</div><ul>${(m.competitor_advantage || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul>
      ${m.to_test && m.to_test.length ? `<div class="xs muted">* To be tested: ${m.to_test.map(esc).join("; ")}</div>` : ""}</div>`).join("")}</div>
  </div>
  <aside class="side">
    <div class="lbl" style="color:var(--color-accent-700)">Verdict</div>
    <p class="small" style="line-height:1.6">${esc(b.exec_summary || "—")}</p>
    ${cardoIdx >= 0 ? `<div class="lbl" style="margin-top:20px">Cardo behind on</div><div class="tags">${behind.map(d => `<span class="tag tag-accent">${esc(d)}</span>`).join("") || `<span class="xs muted">Nothing in this lineup</span>`}</div>
    <div class="lbl">Cardo ahead on</div><div class="tags">${ahead.map(d => `<span class="tag tag-outline">${esc(d)}</span>`).join("") || `<span class="xs muted">Nothing in this lineup</span>`}</div>
    <div class="xs muted">Computed from the ${B.models.length} columns shown, against the best rival rating per dimension.</div>` : `<div class="xs muted">Add a Cardo model to see where Cardo is ahead or behind.</div>`}
  </aside></div>`;
  el.querySelectorAll("[data-bi]").forEach(t => t.onclick = () => go("#/products/battles/" + encodeURIComponent(list[+t.dataset.bi].id)));
  el.querySelectorAll("[data-bm]").forEach(t => t.onclick = () => { B.mode = t.dataset.bm; renderPBody(); });
  el.querySelector("#batNotes").onchange = e => { B.notes = e.target.checked; renderPBody(); };
  el.querySelectorAll("[data-swap]").forEach(t => t.onclick = () => { const ci = +t.dataset.swap; B.swapOpen = B.swapOpen === ci ? null : ci; renderPBody(); const s = el.querySelector(`[data-sel="${ci}"]`); if (s) s.focus(); });
  el.querySelectorAll("[data-sel]").forEach(s => s.onchange = () => { B.models[+s.dataset.sel] = s.value.split("|"); B.swapOpen = null; renderPBody(); });
  el.querySelectorAll("[data-rm]").forEach(t => t.onclick = () => { B.models.splice(+t.dataset.rm, 1); B.swapOpen = null; renderPBody(); });
  const add = el.querySelector("#addCol");
  if (add) add.onclick = () => { const used = new Set(B.models.map(m => m.join("|"))); const next = POOL_KEYS.find(k => !used.has(k)); if (!next) return; B.models.push(next.split("|")); B.swapOpen = B.models.length - 1; renderPBody(); };
  bindTT(el, ".dim", s => { const r = b.ratings.rows[+s.dataset.ri]; return `<b>${esc(r.dimension)}</b>${legend[r.dimension] ? "<br>" + esc(legend[r.dimension]) : ""}${r.note ? "<br><br>" + esc(r.note) : ""}`; });
}

  "Mid-range battle": ["Cardo|Packtalk Neo", "Cardo|Freecom 4x", "Sena|50S", "Sena|Spider RT1 / ST1", "Reso|Reso Pilot Neo", "ASMAX|F1 Pro"],

  "Smart helmets": ["Cardo|Beyond GTS (smart helmet)", "Cardo|Venture (integrated MX helmet)"]
};

    ["Brand", p => brandLbl(p.brand)],

    ["MSRP", p => fmt$(p.msrp_usd)],

    ["Intercom tech", p => esc(p.intercom_tech || "—")],

    ["Max riders", p => hl(p.max_riders, best.riders, esc(p.max_riders ?? "—"))],

    ["Weight", p => { const w = p.dimensions?.form_factor?.weight_g; return w ? esc(w) + " g" : "—"; }],
    ["Controls", p => esc(p.dimensions?.ease_of_use?.controls || "—")],
    ["Mount", p => esc(p.dimensions?.ease_of_use?.mount || "—")],
    ["Speaker size", p => { const s = p.dimensions?.sound?.speaker_size_mm; return s ? esc(s) + " mm" : "—"; }],
    ["Service reputation", p => `<span class="muted">${esc(p.dimensions?.quality?.service_reputation || "—")}</span>`],
    ["Firmware", p => { const f = fwFor(p); return f?.firmware_version ? "v" + esc(String(f.firmware_version).split(/[\s(]/)[0]) + (f.firmware_last_updated ? " · " + esc(fmtDay(f.firmware_last_updated)) : "") : "—"; }],
    ["Released", p => esc(p.release_year ?? "—")],
    ["Key features", p => `<ul>${(p.features || []).slice(0, 8).map(f => `<li>${esc(f.length > 90 ? f.slice(0, 90) + "…" : f)}</li>`).join("")}</ul>`],
    ["Notes", p => `<span class="muted">${esc((p.notes || "").slice(0, 220))}${(p.notes || "").length > 220 ? "…" : ""}</span>`],
    ["Product page", p => p.url ? extLink(p.url, "View", "more") : "—"]
  ];
  el.innerHTML = `<div style="border-top:1px solid var(--color-divider);padding-top:20px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
      <span class="lbl" style="margin:0">Presets</span>
      <span class="seg sm scroll" role="group" aria-label="Presets">${Object.keys(PRESETS).map(k => `<button type="button" data-preset="${esc(k)}" aria-pressed="${C.preset === k}">${esc(k)}</button>`).join("")}</span>
      <span class="xs muted">or pick up to 7 models · ${models.length} selected</span></div>
    <div class="picker">${BN.map(b => `<div class="row${S.brands.has(b) ? "" : " dim"}"${S.brands.has(b) ? "" : ' title="Hidden in the sidebar brand filter; still pickable"'}><span class="brand">${bm(b)}${esc(b)}</span>${PRODUCTS.filter(p => p.brand === b).map(p => `<button type="button" class="pick" data-k="${esc(p.id)}" aria-pressed="${C.sel.has(p.id)}">${esc(p.name.replace(/\s*\(.*\)/, ""))}</button>`).join("")}</div>`).join("")}</div>

/* ================= GAPS ================= */
function renderGaps(app) {
  const G = S.gaps;
  const hasWeekly = GAPS.some(g => g.src === "weekly");
  const baseN = GAPS.filter(g => g.src === "baseline").length;
  const pool = GAPS.filter(g => G.baseline || g.src === "weekly");
  const types = [...new Set(pool.map(g => g.cat))];
  if (G.type !== "all" && !types.includes(G.type)) G.type = "all";
  const statuses = [...new Set(pool.filter(g => g.f).map(g => g.f.cardo_status))].sort();
  let rows = pool.filter(g => (G.type === "all" || g.cat === G.type) && (G.severity === "all" || g.severity === G.severity) && (G.status === "all" || g.f?.cardo_status === G.status));
  if (G.sortKey !== "rank") rows = rows.slice().sort((a, b) => (G.sortKey === "severity" ? a.sevI - b.sevI : G.sortKey === "type" ? typeLbl(a.cat).localeCompare(typeLbl(b.cat)) : G.sortKey === "status" ? (a.f?.cardo_status || "").localeCompare(b.f?.cardo_status || "") : a.title.localeCompare(b.title)) * G.sortDir || a.sevI - b.sevI);
  const cnt = s => rows.filter(g => g.severity === s).length;
  const actionOf = g => {
    if (g.recs?.length) return `<span class="gap-act">${esc(g.recs[0].title)} · ${esc(cap(g.recs[0].horizon || ""))}${g.recs.length > 1 ? ` <span class="muted">+${g.recs.length - 1} more</span>` : ""}</span>`;
    if (g.f?.recommendation) return `<span class="gap-act">${esc(firstSentence(g.f.recommendation))} <span class="muted">· ${esc(BASE_ASOF)}</span></span>`;
    return `<span class="gap-act none">No action assigned</span>`;
  };
  const sortBtn = (k, l) => `<button type="button" class="th-sort" data-gs="${k}">${l}${G.sortKey === k ? icon(G.sortDir > 0 ? "chevUp" : "chevDown", 12) : ""}</button>`;
  const body = g => {
    const ev = g.g?.evidence || [];
    const evAll = G.evidenceAll.has(g.id);
    const linked = gapSignals(g);
    if (g.g) return `<div class="gap-body">
      <div class="desc">${esc(g.g.description || "")}</div>
      <div><div class="lbl">Evidence</div>
        <ul>${(evAll ? ev : ev.slice(0, 3)).map(e => `<li>${esc(e)}</li>`).join("")}</ul>
        ${ev.length > 3 ? `<button type="button" class="linkbtn" data-ev="${g.id}">${evAll ? "Show fewer" : "Show all " + ev.length + " evidence points"}</button>` : ""}
        ${g.g.customer_signal ? `<div class="quote">${esc(g.g.customer_signal)}</div>` : ""}
        ${linked.length ? `<a class="more" href="#/signals?gap=${g.id}&range=all">${linked.length} linked signal${linked.length > 1 ? "s" : ""} ${icon("arrow", 13)}</a>` : `<span class="xs muted">No linked signals in the feed</span>`}
        ${srcLinks(g.g.sources)}</div>
      <div><div class="lbl">Competition</div><div>${esc(g.g.competitor_benchmark || "—")}</div>
        ${g.recs.length ? `<div class="lbl" style="margin-top:16px">Action${g.recs.length > 1 ? "s" : ""}</div>${g.recs.map(r => `<div style="margin-bottom:10px"><b>${esc(r.priority)}. ${esc(r.title)}</b> <span class="muted">· ${esc(cap(r.horizon || ""))} · ${esc(r.effort || "—")} effort</span>${r.expected_impact ? `<div class="muted">${esc(r.expected_impact)}</div>` : ""}</div>`).join("")}` : ""}</div></div>`;
    if (g.f) return `<div class="gap-body">
      <div><div class="lbl">Cardo · status: ${esc(g.f.cardo_status)}</div><div>${esc(g.f.cardo_note || "—")}</div></div>
      <div><div class="lbl">Competition</div><div>${esc(g.f.competitor_note || "—")}</div>
        ${g.f.recommendation ? `<div class="lbl" style="margin-top:16px">Recommendation (${esc(BASE_ASOF)})</div><div>${esc(g.f.recommendation)}</div>` : ""}</div></div>`;
    return `<div class="gap-body">
      <div class="desc">${esc(g.p.gap || "")}</div>
      <div><div class="lbl">Cardo</div><div>${esc(g.p.cardo || "—")}</div>${g.p.insight ? `<div class="lbl" style="margin-top:16px">Insight</div><div>${esc(g.p.insight)}</div>` : ""}</div>
      <div><div class="lbl">Competition</div><ul>${(g.p.competitors || []).map(c => `<li>${brandLbl(c.brand)} ${esc(c.product)} <b class="num">${esc(c.price)}</b><br><span class="muted">${esc(c.note || "")}</span></li>`).join("")}</ul></div></div>`;
  };
  const featLeads = (GAP.feature_gaps || []).filter(f => ["leads", "parity"].includes(f.cardo_status));
  const leadItem = (k, titleHtml, detail) => { const open = G.openLeads.has(k); return `<button type="button" class="plain lead-item" data-lead="${k}" aria-expanded="${open}" style="width:100%">${icon("check")}<div>${titleHtml}${detail && open ? `<div class="d">${esc(detail)}</div>` : ""}</div></button>`; };
  app.innerHTML = `<div class="page">
   <div class="page-head" style="margin-bottom:16px"><h2>Where Cardo is exposed</h2>
     <span class="small muted">${rows.length} gap${rows.length === 1 ? "" : "s"}${SEV_ORDER.map(s => cnt(s) ? ` · ${cnt(s)} ${s}` : "").join("")}</span>
     <span class="spacer"></span>
     <span class="seg" role="group" aria-label="Type">${[["all", "All"], ...types.map(t => [t, typeLbl(t)])].map(([k, l]) => `<button type="button" data-gt="${k}" aria-pressed="${G.type === k}">${esc(l)}</button>`).join("")}</span></div>
   <div class="filters" style="margin:0 0 16px">
     <select class="input" id="gSev" aria-label="Severity"><option value="all">All severities</option>${SEV_ORDER.filter(s => pool.some(g => g.severity === s)).map(s => `<option value="${s}"${G.severity === s ? " selected" : ""}>${cap(s)}</option>`).join("")}</select>
     ${statuses.length ? `<select class="input" id="gStatus" aria-label="Cardo status"><option value="all">All statuses</option>${statuses.map(s => `<option value="${esc(s)}"${G.status === s ? " selected" : ""}>${esc(cap(s))}</option>`).join("")}</select>` : ""}
     ${hasWeekly && baseN ? `<label class="check"><input type="checkbox" id="gBase"${G.baseline ? " checked" : ""}> Include ${esc(BASE_ASOF)} gap-analysis baseline (${baseN})</label>` : ""}
     <span class="spacer"></span>
     <span class="seg sm" role="group" aria-label="Layout"><button type="button" data-gv="list" aria-pressed="${G.view === "list"}">List</button><button type="button" data-gv="table" aria-pressed="${G.view === "table"}">Table</button></span>
     ${G.view === "list" ? `<button type="button" class="linkbtn" id="gAll">${G.allOpen ? "Collapse all" : "Expand all"}</button>` : ""}
   </div>
   <div class="split"><div class="main" style="padding-top:0">
     ${G.view === "table" ? `<div class="tbl-wrap"><table class="table gtbl"><thead><tr><th>${sortBtn("severity", "Severity")}</th><th>${sortBtn("title", "Gap")}</th><th>${sortBtn("type", "Type")}</th><th>${sortBtn("status", "Cardo status")}</th><th>Cardo</th><th>Competition</th><th>Recommendation</th></tr></thead><tbody>
       ${rows.map(g => `<tr><td><span class="sev sev-${esc(g.severity)}">${sevBars(g.severity)}${esc(cap(g.severity || "—"))}</span></td>
         <td>${g.no ? `<span class="gap-no">#${g.no}</span>` : ""}<a href="#/gaps?open=${g.id}" style="color:inherit;text-decoration:none">${esc(g.title)}</a>${g.src === "baseline" ? `<div class="gap-src">Baseline · ${esc(BASE_ASOF)}</div>` : ""}</td>
         <td>${esc(typeLbl(g.cat))}</td><td>${esc(g.f?.cardo_status || "—")}</td>
         <td>${esc(g.f?.cardo_note || g.p?.cardo || g.g?.description || "—")}</td>
         <td>${esc(g.f?.competitor_note || g.g?.competitor_benchmark || (g.p?.competitors || []).map(c => `${c.brand} ${c.product} ${c.price}`).join("; ") || "—")}</td>
         <td>${esc(g.f?.recommendation || (g.recs || []).map(r => r.title).join("; ") || g.p?.insight || "—")}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">No gaps match these filters.</td></tr>`}</tbody></table></div>` : `
     <div class="gap-hd">${sortBtn("severity", "Severity")}${sortBtn("title", "Gap")}${sortBtn("type", "Type")}<span class="lbl" style="margin:0">Action</span><span></span></div>
     <div class="rows">${rows.map(g => { const open = G.allOpen || G.expandedId === g.id; return `<div class="gap-item${open ? " open" : ""}" id="gap-${g.id}">
       <button type="button" class="plain gap-row" data-gid="${g.id}" aria-expanded="${open}">
         <span class="sev sev-${esc(g.severity)}">${sevBars(g.severity)}${esc(cap(g.severity || "—"))}</span>
         <div><div class="gap-title">${g.no ? `<span class="gap-no">#${g.no}</span>` : ""}${esc(g.title)}</div>${g.src === "baseline" ? `<div class="gap-src">Gap-analysis baseline · ${esc(BASE_ASOF)}</div>` : ""}</div>
         <span class="gap-type">${esc(typeLbl(g.cat))}</span>
         ${actionOf(g)}
         <span class="gap-chev">${icon(open ? "chevUp" : "chevDown")}</span></button>
       ${open ? body(g) : ""}</div>`; }).join("") || `<div class="empty">No gaps match these filters.</div>`}</div>`}
   </div>
   <aside class="side" style="padding-top:0">
     <h4 style="font-size:22px;margin:0">Where Cardo leads</h4>
     <div class="xs muted" style="margin-bottom:6px">Defend these in messaging · ${esc(BASE_ASOF)} gap analysis</div>
     <div class="rows">${(GAP.advantages || []).map((a, i) => leadItem("a" + i, esc(a.title), a.detail)).join("")}</div>
     ${featLeads.length ? `<div class="lbl" style="margin-top:22px">Feature checks · Cardo leads or at parity</div>
       <div class="rows">${featLeads.map((f, i) => leadItem("f" + i, `${esc(f.feature)} <span class="tag ${f.cardo_status === "leads" ? "tag-accent" : "tag-neutral"}" style="margin-left:4px">${esc(f.cardo_status)}</span>`, f.cardo_note)).join("")}</div>` : ""}
     ${(GAP.recommendations || []).length ? `<div style="margin-top:22px"><button type="button" class="linkbtn" id="gRecs" aria-expanded="${G.recsAll}">${G.recsAll ? "Hide" : "Show"} ${GAP.recommendations.length} earlier recommendations (${esc(BASE_ASOF)})</button>
       ${G.recsAll ? `<div class="rows" style="margin-top:8px">${GAP.recommendations.map(r => `<div class="rec"><span class="no">${esc(r.priority)}</span><span><span class="t">${esc(r.title)}</span><span class="body" style="display:block;margin-top:3px">${esc(r.detail || "")}</span></span></div>`).join("")}</div>` : ""}</div>` : ""}
   </aside></div></div>`;
  const $ = s => app.querySelector(s);
  app.querySelectorAll("[data-gt]").forEach(b => b.onclick = () => { G.type = b.dataset.gt; render(); });
  $("#gSev").onchange = e => { G.severity = e.target.value; render(); };
  if ($("#gStatus")) $("#gStatus").onchange = e => { G.status = e.target.value; render(); };
  if ($("#gBase")) $("#gBase").onchange = e => { G.baseline = e.target.checked; G.status = "all"; render(); };
  if ($("#gRecs")) $("#gRecs").onclick = () => { G.recsAll = !G.recsAll; render(); };
  app.querySelectorAll("[data-gv]").forEach(b => b.onclick = () => { G.view = b.dataset.gv; render(); });
  if ($("#gAll")) $("#gAll").onclick = () => { G.allOpen = !G.allOpen; G.expandedId = null; render(); };
  app.querySelectorAll("[data-gs]").forEach(b => b.onclick = () => { const k = b.dataset.gs; G.sortDir = G.sortKey === k ? -G.sortDir : 1; G.sortKey = k; render(); });
  app.querySelectorAll("[data-gid]").forEach(b => b.onclick = () => { if (G.allOpen) { G.allOpen = false; G.expandedId = null; } else G.expandedId = G.expandedId === b.dataset.gid ? null : b.dataset.gid; render(); });
  app.querySelectorAll("[data-lead]").forEach(b => b.onclick = () => { const k = b.dataset.lead; G.openLeads.has(k) ? G.openLeads.delete(k) : G.openLeads.add(k); render(); });
  app.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => { const id = b.dataset.ev; G.evidenceAll.has(id) ? G.evidenceAll.delete(id) : G.evidenceAll.add(id); render(); });
}

/* ================= SIGNALS ================= */
function sigFiltered(opts = {}) {
  const s = S.signals;
  const cut = s.range === "all" ? null : REF_T - (+s.range) * 864e5;
  const urls = s.gap ? gapUrls(GAP_BY[s.gap]) : null;
  const q = opts.noQuery ? "" : s.query.trim().toLowerCase();
  return SIG.filter(x => S.brands.has(x.brand) && (!s.brand || x.brand === s.brand) && (cut == null || (x.d && x.d.end >= cut))

          : cs.firmware_baseline ? `<p class="note" style="margin-top:10px"><b>Firmware baseline:</b> ${esc(cs.firmware_baseline)}</p>` : ""}
        ${cs.notes ? `<div style="margin-top:10px"><div class="note${notesOpen ? "" : " clamp"}">${linkify(cs.notes)}</div><button type="button" class="linkbtn" data-open="swnotes">${notesOpen ? "Show less" : "Read software notes"}</button></div>` : ""}</div>
      <div><h4>Press &amp; awards</h4>
        ${pc.summary ? `<p class="note">${esc(pc.summary)}</p>` : ""}
        ${pc.overall_tone ? `<div class="note${toneOpen ? "" : " clamp"}"><b>Tone:</b> ${esc(pc.overall_tone)}</div><button type="button" class="linkbtn" data-open="tone">${toneOpen ? "Show less" : "Read full tone"}</button>` : ""}
        <div class="kv" style="margin-top:10px"><span>Reviews tracked</span><b>${(pc.reviews || []).length} · <a class="more" href="#/signals?type=press&brand=${encodeURIComponent(name)}&range=all">Read ${icon("arrow", 12)}</a></b></div>
        ${(pc.awards || []).length ? `<div class="lbl" style="margin-top:14px">Awards</div><ul class="note" style="padding-left:16px;margin:0">${pc.awards.map(a => `<li>${typeof a === "string" ? esc(a) : esc([a.award || a.name || a.title, a.product, a.year || a.date].filter(Boolean).join(" · ")) + (a.url ? " " + extLink(a.url, "source") : "")}</li>`).join("")}</ul>` : `<div class="kv"><span>Awards</span><b>0</b></div>`}</div>
      <div><h4>Social presence</h4>
        ${[["Instagram", sm.instagram, "followers"], ["Facebook", sm.facebook, "followers"], ["YouTube", sm.youtube, "subscribers"], ["TikTok", sm.tiktok, "followers"]].filter(x => x[1]).map(([l, o, k]) => { const h = o.handle || o.page || o.channel; return `<div class="kv"><span>${l}${h ? `<span class="xs muted" style="display:block;font-weight:400">${esc(String(h).length > 80 ? String(h).slice(0, 77) + "…" : h)}</span>` : ""}</span><b>${o[k] != null ? (o.url ? extLink(o.url, num(o[k])) : num(o[k])) : (o.url ? extLink(o.url, "profile") : "n/a")}</b></div>${o.notes ? `<div class="xs muted" style="padding:4px 0 8px;line-height:1.5">${esc(o.notes)}</div>` : ""}`; }).join("")}
        ${sm.reddit?.sentiment ? `<p class="note" style="margin-top:10px"><b>Reddit:</b> ${esc(sm.reddit.sentiment)} ${sm.reddit.url ? extLink(sm.reddit.url, "search") : ""}</p>` : ""}
        ${(sm.reddit?.common_praise || []).length ? `<div class="lbl" style="margin-top:10px">Common praise</div><ul class="note" style="padding-left:16px;margin:0">${sm.reddit.common_praise.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${(sm.reddit?.common_complaints || []).length ? `<div class="lbl" style="margin-top:10px">Common complaints</div><ul class="note" style="padding-left:16px;margin:0">${sm.reddit.common_complaints.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${sm.summary ? `<p class="note" style="margin-top:10px">${esc(sm.summary)}</p>` : ""}</div>
      <div><h4>Company</h4>
        <div class="note"><div class="lbl" style="margin:0 0 2px">Headquarters</div>${esc(c.hq || "—")}</div>
        <div class="note" style="margin-top:10px"><div class="lbl" style="margin:0 0 2px">Founded</div>${esc(c.founded || "—")}</div>
        <div class="note" style="margin-top:10px"><div class="lbl" style="margin:0 0 2px">Channels</div>${esc(c.channels || "—")}</div></div>
    </div></div>`;
  bindBrandTabs(app);
  app.querySelectorAll("[data-open]").forEach(t => t.onclick = () => { const k = t.dataset.open; S.brandOpen.has(k) ? S.brandOpen.delete(k) : S.brandOpen.add(k); render(); });
}

/* ================= render ================= */
function render() {
  hideTT();
  const y = scrollY, fk = focusKey();
  renderTop();
  const app = document.getElementById("app");
  ({brief: renderBrief, products: renderProducts, gaps: renderGaps, signals: renderSignals, brands: renderBrands})[S.route](app);
  syncHash();
  scrollTo(0, y);
  refocus(fk);
}
let lastRouteKey = null;
function onHash() {
  applyHash();
  const key = location.hash.split("?")[0];
  render();
  if (key !== lastRouteKey) { scrollTo(0, 0); lastRouteKey = key; }
  if (S.route === "gaps" && S.gaps.expandedId) { const el = document.getElementById("gap-" + S.gaps.expandedId); if (el) el.scrollIntoView({block: "start"}); }
}
addEventListener("hashchange", onHash);
onHash();
</script>
</body>
</html>
