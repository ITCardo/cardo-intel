name: Weekly Competitive Research Refresh

on:
  schedule:
    # Run every Monday at 10:00 AM US Eastern (14:00 UTC during EDT; drifts
    # to 15:00 UTC during EST since GitHub Actions cron doesn't follow DST)
        - cron: '7 14 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  determine-brands:
    # Reads research/brands.json so the brand list is config-driven: adding a
    # new competitor to track is just adding an entry there, never a workflow
    # edit or a new job below.
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.read.outputs.brands }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Read brand slugs from research/brands.json
        id: read
        run: |
          BRANDS=$(python3 -c "import json; print(json.dumps([b['slug'] for b in json.load(open('research/brands.json'))['brands']]))")
          echo "brands=$BRANDS" >> "$GITHUB_OUTPUT"
          echo "Tracking brands: $BRANDS"

  research-agents:
    needs: determine-brands
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJson(needs.determine-brands.outputs.brands) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic keepa
      - name: Run ${{ matrix.brand }} research agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python scripts/research_agent.py ${{ matrix.brand }}
      - name: Upload updated research/${{ matrix.brand }}.json
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.brand }}
          path: research/${{ matrix.brand }}.json

  social-listeners:
    needs: [determine-brands, research-agents]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic
      - name: Download updated research files from research-agents job
        uses: actions/download-artifact@v4
        with:
          pattern: research-*
          path: research/_incoming
          merge-multiple: false
      - name: Merge downloaded research files into research/
        run: |
          for d in research/_incoming/research-*; do
            slug="${d#research/_incoming/research-}"
            cp "$d/${slug}.json" "research/${slug}.json"
          done
          rm -rf research/_incoming
      - name: Run Social Media Listener (Reddit)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/social_media_listener.py
      - name: Run Apify Social Listener (Facebook Groups + Instagram)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/apify_social_listener.py
      - name: Upload merged research/ directory
        uses: actions/upload-artifact@v4
        with:
          name: research-merged
          path: research/

  publish:
    needs: social-listeners
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # GitHub Actions doesn't allow the `secrets` context inside a step's
      # `if:` conditional directly — expose it as a job-level env var instead
      # and branch on that below (see the three steps that reference it).
      AZURE_DEPLOY_ENABLED: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic keepa

      - name: Configure Git
        run: |
          git config --global user.name "cardo-intel-bot"
          git config --global user.email "bot@cardo-intel.local"

      - name: Download merged research/ directory
        uses: actions/download-artifact@v4
        with:
          name: research-merged
          path: research

      - name: Run Product Expert agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/product_expert.py
          echo "✅ Product Expert analysis complete"

      - name: Build dashboard
        run: |
          python build.py
          echo "✅ Dashboard built successfully"

      - name: Validate JavaScript
        run: |
          if command -v node &> /dev/null; then
            python3 scripts/validate_dashboard_js.py
          else
            echo "⚠️ Node.js not available, skipping JS validation"
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected - will commit"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add research/*.json dashboard.html index.html
          git commit -m "Weekly data refresh $(date +%Y-%m-%d)"
          git push origin HEAD:main
          echo "✅ Changes pushed to GitHub"

      # Stages only the files the public site actually needs into site/ (not
      # committed to git — see .gitignore) so the Azure deploy below doesn't
      # upload the repo's research data, scripts, or docs alongside the site.
      - name: Prepare Azure site folder
        if: ${{ env.AZURE_DEPLOY_ENABLED == 'true' }}
        run: |
          mkdir -p site
          cp index.html dashboard.html login.html staticwebapp.config.json site/

      # Deploys the already-built dashboard (index.html/dashboard.html) plus
      # login.html and staticwebapp.config.json to Azure Static Web Apps. This
      # step is a no-op until AZURE_STATIC_WEB_APPS_API_TOKEN exists as a repo
      # secret, so it's safe to have merged before the Azure resource is
      # provisioned — see AUTOMATION_SETUP.md for the one-time setup this depends on.
      - name: Deploy to Azure Static Web Apps
        if: ${{ env.AZURE_DEPLOY_ENABLED == 'true' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/site"
          output_location: ""
          skip_app_build: true

      - name: Skip Azure deploy (secret not configured yet)
        if: ${{ env.AZURE_DEPLOY_ENABLED == 'false' }}
        run: echo "ℹ️ AZURE_STATIC_WEB_APPS_API_TOKEN not set — skipping Azure deploy. See AUTOMATION_SETUP.md."

      - name: Verify deployment
        run: |
          echo "Waiting for the site to update..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://itcardo.github.io/cardo-intel/)
          if [ "$STATUS" = "200" ]; then
            echo "ℹ️ GitHub Pages still serving at https://itcardo.github.io/cardo-intel/ (disable this source in repo Settings once Azure is confirmed working, per AUTOMATION_SETUP.md)"
          else
            echo "⚠️ GitHub Pages returned status $STATUS (may still be rebuilding, or already disabled)"
          fi

      - name: Summary
        if: always()
        run: |
          echo "=== Weekly Refresh Summary ==="
          echo "Date: $(date -u)"
          echo "Status: ${{ job.status }}"
          if [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ]; then
            echo "Result: ✅ Updates committed and published"
          else
            echo "Result: ℹ️ No changes to commit"
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: [determine-brands, research-agents, social-listeners, publish]
    if: failure()
    steps:
      - name: Log failure
        run: |
          echo "❌ Weekly refresh workflow failed!"
          echo "Check the logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
