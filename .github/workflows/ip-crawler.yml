name: IP Crawler Weekly

# Weekly patent (IP) watch for Sena, Cardo, Reso and ASMAX.
# - Triggered every Saturday 03:17 UTC by the Azure Logic App "logic-cardo-intel-ip-trigger"
#   (workflow_dispatch; GitHub's own cron was unreliable for this repo). The EPO asks automatic
#   tools to run 19:00-07:00 GMT or at weekends, hence Saturday night.
# - Saves the result to research/ip_results.json on main. The Monday refresh (daily-refresh.yml)
#   picks that file up and build.py embeds it into the dashboard.
# - Also uploads an artifact "ip-preview" (ip_preview.html + ip_results.json) for a quick look.
# - Runs with the demo switch or with a brand filter never touch research/ip_results.json.

on:
  workflow_dispatch:
    inputs:
      brands:
        description: "Brands to crawl, comma separated (sena,cardo,reso,asmax). Empty = all"
        required: false
        default: ""
      families:
        description: "Let Claude file records that are not yet in a product family (uses ANTHROPIC_API_KEY)"
        type: boolean
        default: true
      demo:
        description: "Layout demo with invented records (no EPO call)"
        type: boolean
        default: false

permissions:
  contents: write        # commits research/ip_results.json to main

concurrency:
  group: ip-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GitHub does not allow the secrets context inside a step "if:", so it is exposed here.
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}
      IN_BRANDS: ${{ inputs.brands }}
      IN_FAMILIES: ${{ inputs.families }}
      IN_DEMO: ${{ inputs.demo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest anthropic google-cloud-bigquery

      - name: Run unit tests
        run: python -m pytest ip-preview/tests -q

      - name: Sign in to Google Cloud (BigQuery patents source)
        if: ${{ env.HAS_GCP == 'true' && env.IN_DEMO != 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run IP crawler
        env:
          EPO_OPS_KEY: ${{ secrets.EPO_OPS_KEY }}
          EPO_OPS_SECRET: ${{ secrets.EPO_OPS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_PROJECT: ${{ env.HAS_GCP == 'true' && vars.GCP_PROJECT || '' }}
          BQ_MAX_GB: ${{ vars.BQ_MAX_GB || '300' }}
        run: |
          args=(--out ip-preview/out)
          if [ "$IN_DEMO" = "true" ]; then args+=(--demo); fi
          if [ -n "$IN_BRANDS" ]; then args+=(--brands "$IN_BRANDS"); fi
          if [ "$IN_FAMILIES" = "true" ]; then args+=(--families); fi
          # last committed results = the "previous run" used to detect NEW and CHANGED
          if [ -f research/ip_results.json ]; then args+=(--previous research/ip_results.json); fi
          python ip-preview/ip_crawler.py "${args[@]}"

      - name: Save results to research/ip_results.json
        if: ${{ env.IN_DEMO != 'true' && env.IN_BRANDS == '' && github.ref == 'refs/heads/main' }}
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("ip-preview/out/ip_results.json"))
          if d.get("demo") or not d.get("complete"):
              print("Run not complete (an error or EPO block): research/ip_results.json is left unchanged.")
              sys.exit(0)
          open("research/ip_results.json", "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=1))
          print("research/ip_results.json updated:", ", ".join(f"{b['name']} {len(b['records'])}" for b in d["brands"]))
          PY
          git config user.name "cardo-intel-bot"
          git config user.email "bot@cardo-intel.local"
          git add research/ip_results.json
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "Weekly IP crawler results $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.demo && 'ip-preview-demo' || 'ip-preview' }}
          path: |
            ip-preview/out/ip_preview.html
            ip-preview/out/ip_results.json
          retention-days: 30
